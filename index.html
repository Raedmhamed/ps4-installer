<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 Custom Directory Installer</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        .container {
            background-color: #1e1e1e;
            border: 1px solid #333;
            display: inline-block;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.7);
            max-width: 90%;
        }
        button {
            background-color: #0070d1;
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover {
            background-color: #005fb8;
        }
        #status {
            margin-top: 20px;
            font-weight: bold;
            color: #00ffcc;
            font-size: 15px;
        }
        .spinner {
            display: none;
            width: 30px;
            height: 30px;
            border: 4px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #00ffcc;
            animation: spin 1s ease-in-out infinite;
            margin: 15px auto 0 auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>PS4 Store Installer</h1>
        <p>Target Directory: /data/pkg/</p>

        <button onclick="sendInstallCommand()">Install Store-R2.pkg</button>

        <div class="spinner" id="loadingSpinner"></div>
        <div id="status">Ready to install.</div>
    </div>

    <script>
        var directPkgUrl = "https://raw.githubusercontent.com/Raedmhamed/ps4-games-raed/main/Store-R2.pkg";

        function sendInstallCommand() {
            var statusEl = document.getElementById('status');
            var spinnerEl = document.getElementById('loadingSpinner');
            
            spinnerEl.style.display = "block";
            statusEl.innerText = "Dispatching package to /data/pkg/ ...";

            // Payload configured with custom directory path for GoldHEN daemon
            var payload = {
                "type": "direct",
                "packages": [directPkgUrl],
                "path": "/data/pkg"
            };

            fetch("http://127.0.0.1:9090/api/install", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            })
            .then(function(response) {
                setTimeout(function() {
                    spinnerEl.style.display = "none";
                    statusEl.innerText = "Queued to /data/pkg! Check PS4 Downloads.";
                }, 2000);
            })
            .catch(function(error) {
                setTimeout(function() {
                    spinnerEl.style.display = "none";
                    statusEl.innerText = "Command sent to system daemon.";
                }, 2000);
            });
        }
    </script>

</body>
</html>
