<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 GoldHEN Package Installer</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        .container {
            background-color: #2a2a2a;
            border: 1px solid #444;
            display: inline-block;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            max-width: 90%;
        }
        button {
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
        }
        .btn-install { background-color: #0070d1; }
        .btn-install:hover { background-color: #005fb8; }
        #status {
            margin-top: 20px;
            font-weight: bold;
            color: #00ffcc;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>PS4 Homebrew Installer</h1>
        <p>Firmware Compatibility Mode</p>

        <!-- Form submitting directly to local GoldHEN daemon -->
        <form action="http://127.0.0.1:9090/api/install" method="POST">
            <input type="hidden" name="type" value="direct">
            <input type="hidden" name="url" value="https://raw.githubusercontent.com/Raedmhamed/ps4-games-raed/main/Store-R2.pkg">
            <input type="hidden" name="packages" value="[&quot;https://raw.githubusercontent.com/Raedmhamed/ps4-games-raed/main/Store-R2.pkg&quot;]">
            <button class="btn-install" type="submit" onclick="setStatus('Dispatching package installer...')">Install Store-R2.pkg</button>
        </form>

        <div id="status"></div>
    </div>

    <script>
        function setStatus(msg) {
            document.getElementById('status').innerText = msg;
        }
    </script>

</body>
</html>
