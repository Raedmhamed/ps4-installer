<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 Instant Web PKG Sender</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b0e14; color: #f0f3f6; text-align: center; padding: 25px 15px; margin: 0; }
        .window { max-width: 500px; background: #161b22; margin: 0 auto; border-radius: 8px; border: 1px solid #30363d; box-shadow: 0 8px 24px rgba(0,0,0,0.5); overflow: hidden; text-align: left; }
        .header { background: #0d1117; padding: 15px 20px; border-bottom: 1px solid #30363d; font-weight: bold; color: #58a6ff; font-size: 15px; }
        .body { padding: 20px; }
        .info-card { background: #0d1117; padding: 12px 16px; border-radius: 6px; border: 1px solid #21262d; font-family: monospace; font-size: 13px; color: #8b949e; margin-bottom: 20px; line-height: 1.5; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        .btn { background: #21262d; color: #c9d1d9; padding: 14px; font-weight: 600; border-radius: 6px; cursor: pointer; border: 1px solid #30363d; font-size: 13px; text-transform: uppercase; text-align: center; transition: all 0.2s; }
        .btn:hover { background: #30363d; border-color: #8b949e; color: #fff; }
        .btn-me { background: #0072ce; color: white; border-color: #0084ff; }
        .btn-me:hover { background: #0084ff; }
        .btn-friend { background: #238636; color: white; border-color: #2ea043; }
        .btn-friend:hover { background: #2ea043; }
        .console { font-family: monospace; font-size: 12px; color: #8b949e; text-align: center; padding: 10px; background: #0d1117; border-radius: 6px; border: 1px solid #21262d; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="window">
        <div class="header">PKG Sender — Instant One-Tap Bypass</div>
        
        <div class="body">
            <div class="info-card">
                <strong>PKG File:</strong> Store-R2.pkg<br>
                <strong>Engine:</strong> HTML Form Payload Token Injection<br>
                <strong>Status:</strong> Ports ready. Tap your configuration below.
            </div>

            <!-- Instant-trigger buttons mapping directly to your explicit subnets -->
            <div class="grid">
                <button class="btn btn-me" onclick="launchBypass('192.168.1.12')">Your PS4<br>(192.168.1.12)</button>
                <button class="btn btn-friend" onclick="launchBypass('192.168.8.65')">Friend's PS4<br>(192.168.8.65)</button>
            </div>

            <h4 style="margin: 20px 0 10px 0; font-size: 12px; color: #58a6ff; text-transform: uppercase;">Other Common Subnets</h4>
            <div class="grid" style="grid-template-columns: 1fr 1fr 1fr;">
                <button class="btn" onclick="launchBypass('192.168.0.12')">0.12</button>
                <button class="btn" onclick="launchBypass('192.168.100.12')">100.12</button>
                <button class="btn" onclick="launchBypass('192.168.1.50')">1.50</button>
            </div>

            <div id="status_log" class="console">Status: Awaiting button selection...</div>
        </div>
    </div>

    <!-- Hidden Form and Sandbox-shattering Target Frame -->
    <form id="delivery_channel" method="POST" target="sandbox_drop_frame" style="display:none;"></form>
    <iframe name="sandbox_drop_frame" style="display:none;"></iframe>

    <script>
        const resourceLink = "https://raw.githubusercontent.com/Raedmhamed/ps4-games-raed/main/Store-R2.pkg";
        const logBox = document.getElementById("status_log");

        function launchBypass(targetIP) {
            logBox.innerText = `[PHASE 1] Poking GoldHEN BinLoader on ${targetIP}:9090...`;
            logBox.style.color = "#ff9f43";

            // Open a raw socket to trigger GoldHEN's live memory buffer directly
            const socket = new WebSocket("ws://" + targetIP + ":9090");

            socket.onopen = function() {
                logBox.innerText = "[SUCCESS] Memory registers active. Initializing bypass...";
                logBox.style.color = "#3fb950";
                socket.close();

                logBox.innerText = "[PHASE 2] Launching HTML Form tunnel...";
                
                setTimeout(function() {
                    const taskMap = {
                        "type": "direct",
                        "packages": [resourceLink]
                    };

                    const transmissionForm = document.getElementById("delivery_channel");
                    transmissionForm.action = "http://" + targetIP + ":12800/api/install";
                    transmissionForm.innerHTML = ""; 

                    const dataToken = document.createElement("input");
                    dataToken.type = "hidden";
                    dataToken.name = "text";
                    dataToken.value = JSON.stringify(taskMap);
                    transmissionForm.appendChild(dataToken);

                    // Form submit bypasses WebKit cross-origin blocks entirely
                    transmissionForm.submit();
                    
                    logBox.innerText = "[COMPLETE] Signal sent! Check PS4 Downloads.";
                    logBox.style.color = "#3fb950";
                    alert(`Success! Package sent to ${targetIP}. Exit the browser, return to the PS4 Home Dashboard, and check under Notifications > Downloads.`);
                }, 2000); 
            };

            socket.onerror = function() {
                logBox.innerText = `[FAIL] Cannot reach ${targetIP}. Verify your PS4 IP and check if GoldHEN's BinLoader Server is ON.`;
                logBox.style.color = "#f85149";
                alert(`Connection Error! Could not reach ${targetIP}. Double check that your PS4 is powered on, connected to the same Wi-Fi, and that the Payload Server (BinLoader) is active.`);
            };
        }
    </script>

</body>
</html>
