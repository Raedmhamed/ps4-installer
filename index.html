<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 GoldHEN Package Installer</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        .container {
            background-color: #2a2a2a;
            border: 1px solid #444;
            display: inline-block;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            max-width: 90%;
            width: 400px;
        }
        button {
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
            width: 80%;
            transition: opacity 0.2s ease;
        }
        .btn-install { background-color: #0070d1; }
        .btn-install:hover { background-color: #005fb8; }
        button:disabled { background-color: #555 !important; cursor: not-allowed; opacity: 0.6; }
        #status {
            margin-top: 20px;
            font-weight: bold;
            padding: 12px;
            border-radius: 5px;
            font-size: 14px;
        }
        .status-idle { color: #00ffcc; }
        .status-success { color: #22c55e; background-color: rgba(34,197,94,0.15); border: 1px solid #22c55e; }
        .status-error { color: #ef4444; background-color: rgba(239,68,68,0.15); border: 1px solid #ef4444; }
    </style>
</head>
<body>

    <div class="container">
        <h1>PS4 Homebrew Installer</h1>
        <p>Console Loopback Auto-Detection Enabled</p>

        <!-- Script hooks completely to the inner JS runtime network engine -->
        <button class="btn-install" id="installBtn" onclick="triggerGoldhenInstall()">Install Store-R2.pkg</button>

        <div id="status" class="status-idle">Ready</div>
    </div>

    <script>
        function triggerGoldhenInstall() {
            var statusDiv = document.getElementById('status');
            var btn = document.getElementById('installBtn');
            
            // Lock interaction options immediately to avoid concurrent network traffic conflicts
            btn.disabled = true;
            statusDiv.className = "status-idle";
            statusDiv.innerText = "Transmitting JSON handshake payload...";

            // Structural payload required by GoldHEN api backend specifications
            var payload = {
                type: "direct",
                packages: ["https://githubusercontent.com"],
                path: "/data/pkg"
            };

            // Instantiate XMLHttp explicitly supported by structural NetFront WebKit on the PS4
            var xhr = new XMLHttpRequest();
            
            // Loopback mechanism auto-targets the host console itself over port 9090
            xhr.open("POST", "http://127.0.0", true);
            xhr.setRequestHeader("Content-Type", "application/json");

            // Event state tracking listening to real background stream variables
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4) {
                    // Check if GoldHEN acknowledged the transfer array successfully
                    if (xhr.status === 200 || xhr.status === 204 || xhr.status === 0) {
                        statusDiv.className = "status-success";
                        statusDiv.innerText = "SUCCESS! Task Registered. Check PS4 Notifications > Downloads.";
                    } else {
                        statusDiv.className = "status-error";
                        statusDiv.innerText = "ERROR! GoldHEN Server rejected the command structure (HTTP " + xhr.status + ").";
                        btn.disabled = false;
                    }
                }
            };

            // Error trap handling if the local network socket fails to connect
            xhr.onerror = function () {
                statusDiv.className = "status-error";
                statusDiv.innerText = "CONNECTION FAILED! Ensure 'Payload Server' is turned ON inside GoldHEN settings.";
                btn.disabled = false;
            };

            // Dispatches raw JSON string payload directly to console background memory structure
            xhr.send(JSON.stringify(payload));
        }
    </script>

</body>
</html>
