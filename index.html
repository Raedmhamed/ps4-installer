
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">
<title>PS4 Notification Sender</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #0b0c10;
    color: #c5c6c7;
    font-family: Arial, sans-serif;
}

.container {
    width: 100%;
    max-width: 460px;
    padding: 25px;
    background: #1f2833;
    border: 2px solid #66fcf1;
    border-radius: 14px;
    box-shadow: 0 8px 30px #0008;
}

h1 {
    color: #66fcf1;
    font-size: 24px;
    text-align: center;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #45f3ff;
    font-size: 13px;
    margin-bottom: 25px;
}

label {
    display: block;
    margin: 15px 0 7px;
    font-size: 12px;
    font-weight: bold;
    color: #66fcf1;
    text-transform: uppercase;
}

input, textarea {
    width: 100%;
    padding: 13px;
    background: #0b0c10;
    color: white;
    border: 1px solid #45f3ff;
    border-radius: 7px;
    font-size: 15px;
    font-family: inherit;
}

textarea {
    min-height: 95px;
    resize: vertical;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 12px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
}

.primary {
    background: #66fcf1;
    color: #0b0c10;
}

.secondary {
    background: #34495e;
    color: white;
}

button:disabled {
    opacity: .5;
    cursor: wait;
}

.console {
    margin-top: 20px;
    padding: 14px;
    background: #0b0c10;
    border: 1px solid #2f3b4c;
    border-radius: 7px;
    font-family: monospace;
    font-size: 12px;
    color: #a2aed2;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
}

.status {
    text-align: center;
    font-size: 13px;
    margin-bottom: 10px;
    color: #ffcc66;
}

.note {
    margin-top: 15px;
    font-size: 12px;
    line-height: 1.6;
    color: #a2aed2;
}
</style>
</head>

<body>

<div class="container">

<h1>PS4 Notify Injector</h1>

<div class="subtitle">
    GoldHEN 12.02 | PC & Mobile
</div>

<div class="status" id="status">
    Not connected
</div>

<label for="ip">PS4 IP Address</label>
<input
    id="ip"
    type="text"
    inputmode="decimal"
    placeholder="192.168.1.100"
    autocomplete="off"
>

<label for="port">Notification Receiver Port</label>
<input
    id="port"
    type="number"
    value="9028"
    min="1"
    max="65535"
>

<label for="message">Notification Message</label>
<textarea
    id="message"
    maxlength="500"
>Notification Activated!</textarea>

<button class="secondary"
        onclick="testConnection()">
    Test Connection
</button>

<button class="primary"
        onclick="sendNotification()">
    Send PS4 Notification
</button>

<div class="console" id="terminal">
[READY] Enter PS4 IP and connect.
</div>

<div class="note">
    Requires a compatible native HTTP
    notification receiver on your PS4.
    Both devices must be on the same network.
</div>

</div>

<script>
"use strict";

var ipInput = document.getElementById("ip");
var portInput = document.getElementById("port");
var msgInput = document.getElementById("message");
var terminal = document.getElementById("terminal");
var statusBox = document.getElementById("status");
var buttons = document.querySelectorAll("button");

try {
    ipInput.value = localStorage.getItem("ps4_ip") || "";
    portInput.value = localStorage.getItem("ps4_port") || "9028";
} catch (e) {}

function log(text, color) {
    terminal.textContent = text;
    terminal.style.color = color || "#a2aed2";
}

function setStatus(text, color) {
    statusBox.textContent = text;
    statusBox.style.color = color;
}

function setBusy(busy) {
    for (var i = 0; i < buttons.length; i++) {
        buttons[i].disabled = busy;
    }
}

function getAddress() {
    var ip = ipInput.value.trim();
    var port = Number(portInput.value);

    if (!/^[a-zA-Z0-9.-]+$/.test(ip)) {
        throw new Error("Invalid PS4 IP or hostname.");
    }

    if (!Number.isInteger(port) ||
        port < 1 || port > 65535) {
        throw new Error("Invalid port number.");
    }

    try {
        localStorage.setItem("ps4_ip", ip);
        localStorage.setItem("ps4_port", String(port));
    } catch (e) {}

    return "http://" + ip + ":" + port;
}

async function request(path, options) {
    var controller = new AbortController();
    var timer = setTimeout(function() {
        controller.abort();
    }, 8000);

    try {
        var response = await fetch(
            getAddress() + path,
            Object.assign({}, options || {}, {
                signal: controller.signal,
                cache: "no-store"
            })
        );

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }

        return response;
    } finally {
        clearTimeout(timer);
    }
}

async function testConnection() {
    setBusy(true);
    setStatus("Connecting...", "#ffcc66");
    log("[CONNECTING] Checking PS4 receiver...");

    try {
        await request("/health");

        setStatus("Receiver online", "#00ff88");
        log(
            "[SUCCESS] PS4 notification receiver is responding.",
            "#00ff88"
        );
    } catch (error) {
        setStatus("Disconnected", "#ff5555");
        log(
            "[ERROR] " + error.message +
            "\nCheck the IP, port, receiver, and browser network permissions.",
            "#ff5555"
        );
    } finally {
        setBusy(false);
    }
}

async function sendNotification() {
    var message = msgInput.value.trim();

    if (!message) {
        log("[ERROR] Enter a message.", "#ff5555");
        return;
    }

    setBusy(true);
    log("[SENDING] Requesting PS4 system notification...");

    try {
        var response = await request("/notify", {
            method: "POST",
            headers: {
                "Content-Type": "text/plain"
            },
            body: message
        });

        var result = await response.text();

        setStatus("Receiver online", "#00ff88");
        log(
            "[SUCCESS] Receiver accepted notification." +
            (result ? "\n" + result : ""),
            "#00ff88"
        );
    } catch (error) {
        setStatus("Send failed", "#ff5555");
        log(
            "[ERROR] " + error.message +
            "\nMake sure the notification receiver is running.",
            "#ff5555"
        );
    } finally {
        setBusy(false);
    }
}
</script>

</body>
</html>
