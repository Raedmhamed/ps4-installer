<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 GoldHEN Package Installer</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        .container {
            background-color: #2a2a2a;
            border: 1px solid #444;
            display: inline-block;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            max-width: 90%;
            width: 400px;
        }
        button {
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
            width: 80%;
        }
        .btn-install { background-color: #0070d1; }
        .btn-install:hover { background-color: #005fb8; }
        button:disabled { background-color: #555 !important; cursor: not-allowed; }
        #status {
            margin-top: 20px;
            font-weight: bold;
            padding: 10px;
            border-radius: 5px;
        }
        .status-idle { color: #00ffcc; }
        .status-success { color: #22c55e; background-color: rgba(34,197,94,0.15); border: 1px solid #22c55e; }
        .status-error { color: #ef4444; background-color: rgba(239,68,68,0.15); border: 1px solid #ef4444; }
    </style>
</head>
<body>

    <div class="container">
        <h1>PS4 Homebrew Installer</h1>
        <p>Firmware Compatibility Mode</p>

        <!-- Fixed to process purely via Javascript Async Loopback -->
        <button class="btn-install" id="installBtn" onclick="triggerGoldhenInstall()">Install Store-R2.pkg</button>

        <div id="status" class="status-idle">Ready</div>
    </div>

    <script>
        function triggerGoldhenInstall() {
            var statusDiv = document.getElementById('status');
            var btn = document.getElementById('installBtn');
            
            // Immediately lock interface to avoid duplicate execution threads
            btn.disabled = true;
            statusDiv.className = "status-idle";
            statusDiv.innerText = "Connecting to GoldHEN Server...";

            // Create precise JSON object matching GoldHEN requirements
            var payload = {
                type: "direct",
                packages: ["https://raw.githubusercontent.com/Raedmhamed/ps4-games-raed/main/Store-R2.pkg"],
                path: "/data/pkg"
            };

            // Instantiate XMLHttp natively supported by PS4 WebKit runtime
            var xhr = new XMLHttpRequest();
            xhr.open("POST", "http://127.0.0.1:9090/api/install", true);
            xhr.setRequestHeader("Content-Type", "application/json");

            // Event listener reading live background states from the console daemon
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4) {
                    // GoldHEN APIs return 200/204 on valid payload processing handshakes
                    if (xhr.status === 200 || xhr.status === 204 || xhr.status === 0) {
                        statusDiv.className = "status-success";
                        statusDiv.innerText = "SUCCESS! Task Registered. Check PS4 Notifications > Downloads.";
                    } else {
                        statusDiv.className = "status-error";
                        statusDiv.innerText = "ERROR! Server rejected payload (HTTP " + xhr.status + ").";
                        btn.disabled = false;
                    }
                }
            };

            // Error trap handling for immediate execution feedback loops
            xhr.onerror = function () {
                statusDiv.className = "status-error";
                statusDiv.innerText = "CONNECTION FAILED! Ensure 'Payload Server' or 'BinLoader' is enabled in GoldHEN Settings.";
                btn.disabled = false;
            };

            // Send raw serialized JSON directly to local port listener
            xhr.send(JSON.stringify(payload));
        }
    </script>

</body>
</html>
