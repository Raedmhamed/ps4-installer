<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 Direct Local Downloader</title>
    <style>
        body { font-family: sans-serif; background: #0f111a; color: #ffffff; text-align: center; padding: 30px 15px; }
        h1 { color: #0072ce; font-size: 22px; margin-bottom: 5px; }
        p { color: #888899; font-size: 14px; margin-bottom: 25px; }
        .card { background: #1a1d29; border: 1px solid #2d3142; padding: 25px; margin: 15px auto; border-radius: 8px; max-width: 450px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .app-title { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        .path-info { font-size: 12px; color: #00ccff; font-family: monospace; margin-bottom: 20px; }
        .btn { display: inline-block; background: #003791; color: white; padding: 14px 28px; border-radius: 5px; font-weight: bold; cursor: pointer; border: none; width: 100%; box-sizing: border-box; font-size: 15px; transition: background 0.2s; }
        .btn:hover { background: #0056e0; }
        .status-box { margin-top: 15px; font-size: 13px; color: #aaabbb; }
    </style>
</head>
<body>

    <h1>PS4 Web-Only File Downloader</h1>
    <p>Downloads directly to console storage without external apps</p>
        
    <!-- File Download Card -->
    <div class="card">
        <div class="app-title">Store-R2.pkg</div>
        <div class="path-info">Target: /data/PKG/Store-R2.pkg</div>
        <button class="btn" onclick="downloadToDataPKG('https://raw.githubusercontent.com/Raedmhamed/ps4-games-raed/main/Store-R2.pkg', 'Store-R2.pkg')">Download to /data/PKG/</button>
        <div id="status" class="status-box">Status: Waiting for click</div>
    </div>

    <script>
        function downloadToDataPKG(fileUrl, fileName) {
            // Using GoldHEN internal storage task API on local loopback interface
            var localApiUrl = "http://127.0.0"; 
            var statusDiv = document.getElementById("status");
            
            statusDiv.innerText = "Requesting system loopback transfer...";
            statusDiv.style.color = "#ffcc00";

            // Instructs the native browser backend to pipe the stream to /data/PKG/
            var payload = {
                "url": fileUrl,
                "path": "/data/PKG/" + fileName
            };

            fetch(localApiUrl, {
                method: "POST",
                body: JSON.stringify(payload),
                headers: {
                    "Content-Type": "application/json"
                }
            })
            .then(response => {
                if(response.ok) {
                    statusDiv.innerText = "Transfer started! Check GoldHEN file task manager.";
                    statusDiv.style.color = "#00ff00";
                    alert("Download started successfully inside /data/PKG/ folder.");
                } else {
                    throw new Error("API rejection");
                }
            })
            .catch(error => {
                statusDiv.innerText = "Failed. Confirm GoldHEN is enabled.";
                statusDiv.style.color = "#ff3333";
                alert("Error: Transfer could not mount over local loopback. Please ensure GoldHEN is running.");
            });
        }
    </script>

</body>
</html>
