<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoldHEN Verified Safe Zone</title>
<style>
    body { background: #121212; color: white; font-family: sans-serif; text-align: center; padding: 40px 12px; margin: 0; }
    h1 { color: #0070d2; margin-bottom: 5px; }
    .subtitle { color: #aaa; margin-top: 0; font-size: 14px; margin-bottom: 30px; }
    
    .pkg-card { background: #1e1e1e; padding: 25px; border-radius: 12px; border: 1px solid #333; margin: 15px; display: inline-block; width: 300px; text-align: left; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .pkg-title { font-size: 18px; font-weight: bold; color: #fff; margin-bottom: 5px; }
    
    button { padding: 12px; font-size: 15px; background: #0070d2; color: white; border: none; cursor: pointer; border-radius: 6px; font-weight: bold; width: 100%; margin-top: 15px; transition: 0.2s; }
    button:hover { background: #0056a3; }
    button:disabled { background: #333; color: #666; cursor: not-allowed; border: 1px dashed #555; }
    
    .status-msg { margin-top: 15px; font-style: italic; color: #ffcc00; font-size: 14px; text-align: center; font-weight: bold; }
    .system-check { max-width: 350px; margin: 0 auto 20px auto; padding: 10px; border-radius: 6px; font-weight: bold; font-size: 14px; background: #222; border: 1px solid #444; }
    
    #lock-screen { display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b0b0b; z-index: 9999; justify-content: center; align-items: center; flex-direction: column; }
    .lock-box { background: #151515; border: 2px solid #0070d2; padding: 40px; border-radius: 12px; max-width: 400px; box-shadow: 0 0 20px rgba(0, 112, 210, 0.15); text-align: center; display: flex; flex-direction: column; align-items: center; }
    
    .circle-loader { border: 4px solid #222; border-radius: 50%; border-top: 4px solid #0070d2; width: 45px; height: 45px; -webkit-animation: spin 1.5s linear infinite; animation: spin 1.5s linear infinite; margin-bottom: 20px; }
    
    /* شريط تقدم مرئي حقيقي */
    .progress-bar-container { width: 100%; background-color: #333; border-radius: 6px; margin-top: 15px; display: none; }
    .progress-bar { width: 0%; height: 10px; background-color: #00ff00; border-radius: 6px; transition: width 0.1s; }

    @-webkit-keyframes spin { 0% { -webkit-transform: rotate(0deg); } 100% { -webkit-transform: rotate(360deg); } }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body>

    <!-- شاشة الفحص الأولي -->
    <div id="lock-screen">
        <div class="lock-box" id="lock-message-box">
            <div class="circle-loader" id="loader-animation"></div>
            <h2 id="lock-title" style="color: #0070d2; margin-top: 0;">Safe Verifying...</h2>
            <p id="lock-desc" style="color: #ddd; font-size: 15px; line-height: 1.5; margin-bottom: 0;">Analyzing console environment safely. Please hold on...</p>
        </div>
    </div>

    <!-- واجهة الموقع الرئيسية -->
    <div id="main-content" style="display:none;">
        <h1>Custom One-Click GoldHEN Zone</h1>
        <p class="subtitle">Secure Environment Validation & Safe Installer</p>

        <div class="system-check" id="sys-status" style="color: #00ff00;">
            🟢 GoldHEN Environment Verified Safely!
        </div>

        <div class="pkg-card">
            <div class="pkg-title">📦 DolphinPS4 Emulator</div>
            <p style="color:#aaa; font-size:13px; margin:5px 0;">Firmware Target: 12.02 / 13.52</p>
            
            <button id="download-btn" onclick="startBlobBypassInstall('https://download1532.mediafire.com/gijdtgq4nnqgWgk1VjlV22LABhZ2KQ3hrZ6tSUCUoJ7JD_MdBNtI_s8LlzOK5WMrpb73O0muYFTJVDUUg7Wz24S2ZjVemUh7n5CUAhMtyKhwWU6McvV1B7ljMmYOWJaJEt0cbnDfyzMo8HaEJV108knVDTGNnw_rwNbZicCK5iilEOY/u40y5ij5wg8y1qk/DolphinPS4-v04.16.pkg', this)">
                Download & Install Package
            </button>
            
            <div class="progress-bar-container" id="progress-container">
                <div class="progress-bar" id="my-bar"></div>
            </div>
            <div id="status-text" class="status-msg" style="color:#00ff00;">Jailbreak Active — Ready to stream.</div>
        </div>
    </div>

    <script>
    window.addEventListener('DOMContentLoaded', function() {
        var userAgent = navigator.userAgent;
        var isPS4 = userAgent.indexOf("PlayStation 4") !== -1;

        if (!isPS4) {
            triggerPermanentLock("❌ Access Denied", "This portal can only be opened from a modified PS4 console browser.");
            return;
        }

        setTimeout(function() {
            var checkFinished = false;
            function logSuccess() {
                if (checkFinished) return;
                checkFinished = true;
                unlockWebsite();
            }

            var xhr = new XMLHttpRequest();
            xhr.open('GET', 'http://127.0.0', true);
            xhr.timeout = 1000;
            xhr.onreadystatechange = function() { if (xhr.readyState === 4) logSuccess(); };
            xhr.onerror = function() { logSuccess(); };
            xhr.ontimeout = function() {
                if (!checkFinished) {
                    triggerPermanentLock("❌ GoldHEN Not Detected", "Ensure <b>Payload Server</b> is active inside GoldHEN settings and refresh.");
                }
            };
            xhr.send();
        }, 800);
    });

    function unlockWebsite() {
        document.getElementById('lock-screen').style.display = "none";
        document.getElementById('main-content').style.display = "block";
    }

    function triggerPermanentLock(title, description) {
        document.getElementById('loader-animation').style.display = "none"; 
        document.getElementById('lock-title').innerHTML = title;
        document.getElementById('lock-title').style.color = "#ff3333";
        document.getElementById('lock-desc').innerHTML = description;
    }

    // الخطة الاحترافية لتخطي خطأ الحظر تماماً عبر محاكاة ملف وثائقي
    function startBlobBypassInstall(directPkgUrl, buttonEl) {
        var statusText = document.getElementById('status-text');
        var progressContainer = document.getElementById('progress-container');
        var progressBar = document.getElementById('my-bar');

        buttonEl.disabled = true;
        progressContainer.style.display = "block";
        statusText.innerText = "Downloading file stream... 0%";
        statusText.style.color = "#ffcc00";

        var xhr = new XMLHttpRequest();
        xhr.open('GET', directPkgUrl, true);
        xhr.responseType = 'blob'; // سحب بايتات الملف الخامة مباشرة

        xhr.onprogress = function(event) {
            if (event.lengthComputable) {
                var percentComplete = Math.round((event.loaded / event.total) * 100);
                progressBar.style.width = percentComplete + '%';
                statusText.innerText = "Downloading to Memory: " + percentComplete + "%";
            }
        };

        xhr.onload = function() {
            if (xhr.status === 200) {
                statusText.innerText = "Bypassing security locks...";
                statusText.style.color = "#00ff00";

                // هنا الحيلة: نقوم بإعادة تغليف بايتات الـ PKG ونقول للمتصفح أن هذا ملف نصي (TXT) أو مستند مدعوم رسمياً
                var blob = new Blob([xhr.response], {type: "text/plain"});
                var downloadUrl = URL.createObjectURL(blob);
                
                // إنشاء رابط تحميل مخفي والضغط عليه تلقائياً
                var hiddenAnchor = document.createElement("a");
                hiddenAnchor.href = downloadUrl;
                
                // تسمية الملف باسم اللعبة مع الحفاظ على امتداد .pkg، المتصفح سيوافق على سحبه لأنه مغلف كـ Blob نصي
                hiddenAnchor.download = "DolphinPS4-v04.16.pkg";
                document.body.appendChild(hiddenAnchor);
                hiddenAnchor.click(); // بدء التنزيل الفعلي لقرص الجهاز الصلب
                document.body.removeChild(hiddenAnchor);

                statusText.innerText = "Injected successfully! Check Package Installer.";
                alert("Success! The file was safely pushed into your console storage. Go to Settings -> Debug Settings -> Package Installer to complete installation.");
            } else {
                statusText.innerText = "Download failed. Server error.";
                statusText.style.color = "#ff3333";
                buttonEl.disabled = false;
            }
        };

        xhr.onerror = function() {
            statusText.innerText = "Connection failed.";
            statusText.style.color = "#ff3333";
            buttonEl.disabled = false;
        };

        xhr.send();
    }
    </script>
</body>
</html>
