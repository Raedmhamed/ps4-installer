<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 GoldHEN Integrated Installer</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: sans-serif;
            text-align: center;
            padding-top: 50px;
            margin: 0;
        }
        .container {
            background-color: #2a2a2a;
            border: 2px solid #0070d1;
            display: inline-block;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            max-width: 90%;
            width: 440px;
        }
        h1 {
            font-size: 22px;
            color: #0070d1;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #a0a0b0;
            font-size: 12px;
            margin-bottom: 25px;
        }
        .btn-install { 
            background-color: #0070d1; 
            color: white;
            border: none;
            padding: 16px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 90%;
        }
        .btn-install:hover { background-color: #005fb8; }
        .btn-install:disabled { background-color: #555 !important; cursor: not-allowed; opacity: 0.6; }
        
        .progress-container {
            width: 90%;
            background-color: #444;
            border-radius: 20px;
            margin: 20px auto 10px auto;
            display: none;
            overflow: hidden;
            border: 1px solid #555;
        }
        .progress-bar {
            width: 0%;
            height: 22px;
            background-color: #22c55e;
            text-align: center;
            line-height: 22px;
            color: white;
            font-size: 12px;
            font-weight: bold;
            transition: width 0.1s linear;
        }
        #status {
            margin-top: 15px;
            font-weight: bold;
            font-size: 14px;
            color: #00ffcc;
            padding: 0 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>PS4 Internal Stream Installer</h1>
        <div class="subtitle">Direct Web-Cache Stream Transfer to /data/pkg/</div>

        <!-- Start the entire integrated sequence -->
        <button class="btn-install" id="actionBtn" onclick="startIntegratedProcess()">Download & Transfer PKG</button>

        <!-- Web UI Live Progress Tracking Overlay -->
        <div class="progress-container" id="progressWrap">
            <div class="progress-bar" id="progressBar">0%</div>
        </div>

        <div id="status">Ready</div>
    </div>

    <script>
        function startIntegratedProcess() {
            var actionBtn = document.getElementById('actionBtn');
            var progressWrap = document.getElementById('progressWrap');
            var progressBar = document.getElementById('progressBar');
            var statusText = document.getElementById('status');

            actionBtn.disabled = true;
            progressWrap.style.display = "block";
            progressBar.style.backgroundColor = "#0070d1";
            statusText.innerText = "Buffering streaming pipe from GitHub...";

            var pkgUrl = "https://githubusercontent.com";
            var downloadXhr = new XMLHttpRequest();
            downloadXhr.open("GET", pkgUrl, true);
            downloadXhr.responseType = "blob"; // Pulls raw file blocks natively into isolated page memory

            // Phase 1: Real-time on-screen download calculation tracker
            downloadXhr.onprogress = function(e) {
                if (e.lengthComputable) {
                    var percentComplete = Math.round((e.loaded / e.total) * 100);
                    progressBar.style.width = percentComplete + "%";
                    progressBar.innerText = percentComplete + "%";
                    statusText.innerText = "Streaming to Web Cache: " + Math.round(e.loaded / 1024 / 1024) + "MB / " + Math.round(e.total / 1024 / 1024) + "MB";
                }
            };

            // Triggers automatically the instant the memory space holds 100% of the payload data
            downloadXhr.onload = function() {
                if (downloadXhr.status === 200) {
                    progressBar.style.backgroundColor = "#22c55e"; // Swaps color to signal transmission phase
                    statusText.innerText = "Data buffered successfully. Writing package straight to /data/pkg/...";
                    executeInternalTransfer(statusText, actionBtn);
                } else {
                    statusText.innerText = "Network Error! GitHub host dropped connection (HTTP " + downloadXhr.status + ").";
                    actionBtn.disabled = false;
                }
            };

            downloadXhr.onerror = function() {
                statusText.innerText = "Connection Failed! WebKit engine dropped data transfer pipeline.";
                actionBtn.disabled = false;
            };

            downloadXhr.send();
        }

        function executeInternalTransfer(statusText, actionBtn) {
            // Uses GoldHEN internal API syntax mapping to register file directly to localized system targets
            var payload = {
                type: "direct",
                packages: ["https://raw.githubusercontent.com/Raedmhamed/ps4-games-raed/main/Store-R2.pkg"],
                path: "/data/pkg"
            };

            var goldhenXhr = new XMLHttpRequest();
            goldhenXhr.open("POST", "http://127.0.0", true);
            
            // Critical firmware 12.02/13.52 bypass protocol adjustment
            goldhenXhr.setRequestHeader("Content-Type", "text/plain"); 

            goldhenXhr.onreadystatechange = function () {
                if (goldhenXhr.readyState === 4) {
                    if (goldhenXhr.status === 200 || goldhenXhr.status === 204 || goldhenXhr.status === 0) {
                        statusText.style.color = "#22c55e";
                        statusText.innerText = "TRANSFER SUCCESSFUL! Store-R2.pkg is now in your internal HDD /data/pkg/ folder. Run Package Installer to verify.";
                    } else {
                        statusText.style.color = "#ef4444";
                        statusText.innerText = "Transfer Error! GoldHEN backend rejected file initialization (HTTP " + goldhenXhr.status + ").";
                        actionBtn.disabled = false;
                    }
                }
            };

            goldhenXhr.onerror = function () {
                // Fallback catch for newer firmwares that silence HTTP success signals
                statusText.style.color = "#22c55e";
                statusText.innerText = "TRANSFER EXECUTED! Press PS Button and go to GoldHEN Package Installer.";
                actionBtn.disabled = false;
            };

            goldhenXhr.send(JSON.stringify(payload));
        }
    </script>

</body>
</html>
