<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Custom One-Click GoldHEN Zone</title>
<style>
body { background: #121212; color: white; font-family: sans-serif; text-align: center; padding: 40px 12px; margin: 0; }
h1 { color: #0070d2; margin-bottom: 5px; }
.subtitle { color: #aaa; margin-top: 0; font-size: 14px; margin-bottom: 30px; }
.pkg-container { display: flex; flex-wrap: wrap; justify-content: center; max-width: 1000px; margin: 0 auto; padding: 10px; }
.pkg-card { background: #1e1e1e; padding: 20px; border-radius: 12px; border: 1px solid #333; margin: 15px; width: 280px; text-align: left; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
.pkg-title { font-size: 18px; font-weight: bold; margin: 0 0 5px 0; color: #fff; }
.pkg-info { color: #888; font-size: 13px; margin: 5px 0; }
button { padding: 12px; font-size: 15px; background: #0070d2; color: white; border: none; cursor: pointer; border-radius: 6px; font-weight: bold; width: 100%; margin-top: 15px; transition: background 0.2s; }
button:hover { background: #0056a3; }
.status-msg { margin-top: 12px; font-style: italic; color: #666; font-size: 13px; text-align: center; min-height: 18px; }
</style>
</head>
<body>

    <h1>Welcome to the One-Click GoldHEN Zone</h1>
    <p class="subtitle">Ensure GoldHEN "Payload Server" is active inside your PS4 Server Settings!</p>

    <div class="pkg-container">
        <!-- CARD 1: DOLPHIN PS4 -->
        <div class="pkg-card">
            <div class="pkg-title">📦 DolphinPS4 Emulator</div>
            <div class="pkg-info"><b>Version:</b> v04.16</div>
            <div class="pkg-info"><b>Firmware:</b> 12.02 / 13.52 / GoldHEN</div>
            
            <!-- ضَعْ رَابِطْ مِيدْيَافَايِرْ العَادِي أَوْ رَابِطْ التَّحْمِيلِ المُبَاشِرِ هُنَا -->
            <button onclick="autoDecodeAndInstall('https://download1532.mediafire.com/gijdtgq4nnqgWgk1VjlV22LABhZ2KQ3hrZ6tSUCUoJ7JD_MdBNtI_s8LlzOK5WMrpb73O0muYFTJVDUUg7Wz24S2ZjVemUh7n5CUAhMtyKhwWU6McvV1B7ljMmYOWJaJEt0cbnDfyzMo8HaEJV108knVDTGNnw_rwNbZicCK5iilEOY/u40y5ij5wg8y1qk/DolphinPS4-v04.16.pkg', this)">
                Click to Install
            </button>
            <div class="status-msg">Ready</div>
        </div>
    </div>

    <script>
    function autoDecodeAndInstall(mediafireUrl, buttonEl) {
        var statusDiv = buttonEl.nextElementSibling;
        statusDiv.innerText = "Extracting live file token...";
        statusDiv.style.color = "#ffcc00";

        // استخدام سيرفر وسيط لتخطي حماية CORS وقراءة كود ميديافاير بالخلفية
        var decodeServer = "https://allorigins.win" + encodeURIComponent(mediafireUrl);

        fetch(decodeServer)
            .then(res => {
                if (res.ok) return res.json();
                throw new Error("Proxy connection failed.");
            })
            .then(data => {
                var htmlRaw = data.contents;
                // جلب رابط الـ CDN المباشر تلقائياً من الصفحة بدون تدخل منك
                var urlMatch = htmlRaw.match(/href="([^"]*mediafire\.com\/[a-zA-Z0-9_\-\.\/]*\.pkg)"/i);
                
                if (urlMatch && urlMatch[1]) {
                    var absoluteCdnUrl = urlMatch[1];
                    statusDiv.innerText = "CDN Link Grabbed! Routing to GoldHEN...";
                    statusDiv.style.color = "#00ff00";
                    
                    // تمرير الرابط المباشر إلى خادم التثبيت الداخلي للـ PS4
                    sendToGoldHEN(absoluteCdnUrl, statusDiv);
                } else {
                    throw new Error("Could not parse direct download token.");
                }
            })
            .catch(error => {
                statusDiv.innerText = "Failed to process MediaFire link.";
                statusDiv.style.color = "#ff3333";
            });
    }

    function sendToGoldHEN(pkgUrl, statusDiv) {
        // تحويل الرابط إلى صيغة مصفوفة بايتات خام متوافقة مع نواة جولد هين
        var arrayData = new TextEncoder().encode(pkgUrl + "\n");

        // إرسال البيانات مباشرة للبورت الداخلي المفتوح في الـ PS4 (9090)
        fetch("http://127.0.0", {
            method: 'POST',
            body: arrayData,
            headers: { 'Content-Type': 'text/plain' },
            mode: 'no-cors' // تخطي حماية كرت المتصفح الداخلي للكونسول
        })
        .then(() => {
            statusDiv.innerText = "Success! Check your PS4 Notifications drawer.";
            statusDiv.style.color = "#00ff00";
        })
        .catch(err => {
            statusDiv.innerText = "Connection failed. Check your Payload Server!";
            statusDiv.style.color = "#ff3333";
            alert("Could not reach GoldHEN! Ensure 'Payload Server' is enabled on port 9090 inside GoldHEN settings.");
        });
    }
    </script>
</body>
</html>
