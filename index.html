<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoldHEN Verified Safe Zone</title>
<style>
    body { background: #121212; color: white; font-family: sans-serif; text-align: center; padding: 40px 12px; margin: 0; }
    h1 { color: #0070d2; margin-bottom: 5px; }
    .subtitle { color: #aaa; margin-top: 0; font-size: 14px; margin-bottom: 30px; }
    
    .pkg-card { background: #1e1e1e; padding: 25px; border-radius: 12px; border: 1px solid #333; margin: 15px; display: inline-block; width: 340px; text-align: left; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .pkg-title { font-size: 18px; font-weight: bold; color: #fff; margin-bottom: 5px; }
    
    .install-btn { 
        display: block;
        padding: 12px; 
        font-size: 15px; 
        background: #0070d2; 
        color: white; 
        text-decoration: none;
        text-align: center;
        border-radius: 6px; 
        font-weight: bold; 
        width: 100%; 
        box-sizing: border-box;
        margin-top: 15px; 
        transition: 0.2s; 
        cursor: pointer;
        border: none;
    }
    .install-btn:hover { background: #0056a3; }
    .install-btn:disabled { background: #333; color: #666; cursor: not-allowed; }
    
    .status-msg { margin-top: 15px; font-style: italic; color: #ffcc00; font-size: 13px; text-align: center; font-weight: bold; line-height: 1.4; }
    .system-check { max-width: 350px; margin: 0 auto 20px auto; padding: 10px; border-radius: 6px; font-weight: bold; font-size: 14px; background: #222; border: 1px solid #444; }
    
    #lock-screen { display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b0b0b; z-index: 9999; justify-content: center; align-items: center; flex-direction: column; }
    .lock-box { background: #151515; border: 2px solid #0070d2; padding: 40px; border-radius: 12px; max-width: 400px; box-shadow: 0 0 20px rgba(0, 112, 210, 0.15); text-align: center; display: flex; flex-direction: column; align-items: center; }
    
    .circle-loader { border: 4px solid #222; border-radius: 50%; border-top: 4px solid #0070d2; width: 45px; height: 45px; -webkit-animation: spin 1.5s linear infinite; animation: spin 1.5s linear infinite; margin-bottom: 20px; }

    @keyframes spin { 0% { -webkit-transform: rotate(0deg); } 100% { -webkit-transform: rotate(360deg); } }
</style>
</head>
<body>

    <div id="lock-screen">
        <div class="lock-box" id="lock-message-box">
            <div class="circle-loader" id="loader-animation"></div>
            <h2 id="lock-title" style="color: #0070d2; margin-top: 0;">Safe Verifying...</h2>
            <p id="lock-desc" style="color: #ddd; font-size: 15px; line-height: 1.5; margin-bottom: 0;">Analyzing console environment safely. Please hold on...</p>
        </div>
    </div>

    <div id="main-content" style="display:none;">
        <h1>Custom One-Click GoldHEN Zone</h1>
        <p class="subtitle">Secure Environment Validation & Safe Installer</p>

        <div class="system-check" id="sys-status" style="color: #00ff00;">
            🟢 GoldHEN Environment Verified Safely!
        </div>

        <div class="pkg-card">
            <div class="pkg-title">📦 DolphinPS4 Emulator</div>
            <p style="color:#aaa; font-size:13px; margin:5px 0;">Firmware Target: 12.02 / 13.52</p>
            
            <button id="install-btn" class="install-btn" onclick="triggerInstallFlow()">
                Install Package (Background)
            </button>
            
            <div id="status-text" class="status-msg" style="color:#ffcc00;">Ready for background installation.</div>
        </div>
    </div>

    <!-- Hidden frame to trigger background installation without turning the screen white -->
    <iframe name="hidden-iframe" id="hidden-iframe" style="display:none;"></iframe>

<script>
    var pkgUrl = "https://download1532.mediafire.com/gijdtgq4nnqgWgk1VjlV22LABhZ2KQ3hrZ6tSUCUoJ7JD_MdBNtI_s8LlzOK5WMrpb73O0muYFTJVDUUg7Wz24S2ZjVemUh7n5CUAhMtyKhwWU6McvV1B7ljMmYOWJaJEt0cbnDfyzMo8HaEJV108knVDTGNnw_rwNbZicCK5iilEOY/u40y5ij5wg8y1qk/DolphinPS4-v04.16.pkg";

    function sendPS4Notification(msg) {
        try {
            var notifyXhr = new XMLHttpRequest();
            notifyXhr.open('POST', 'http://127.0.0.1:9090/api/notify', true);
            notifyXhr.setRequestHeader('Content-Type', 'application/json');
            notifyXhr.send(JSON.stringify({ message: msg }));
        } catch(e) {}
    }

    window.addEventListener('DOMContentLoaded', function() {
        var userAgent = navigator.userAgent;
        var isPS4 = userAgent.indexOf("PlayStation 4") !== -1;
        var debugBypass = window.location.hash === '#debug';

        if (!isPS4 && !debugBypass) {
            document.getElementById('loader-animation').style.display = "none";
            document.getElementById('lock-title').innerHTML = "❌ Access Denied";
            document.getElementById('lock-title').style.color = "#ff3333";
            document.getElementById('lock-desc').innerHTML = "This portal can only be opened from a modified PS4 console browser.";
            return;
        }

        setTimeout(function() {
            document.getElementById('lock-screen').style.display = "none";
            document.getElementById('main-content').style.display = "block";
            sendPS4Notification("GoldHEN Zone Loaded Successfully.");
        }, 800);
    });

    function triggerInstallFlow() {
        var btn = document.getElementById('install-btn');
        var statusText = document.getElementById('status-text');
        
        btn.disabled = true;
        statusText.innerText = "Sending download request...";
        statusText.style.color = "#ffcc00";

        sendPS4Notification("DolphinPS4 Download Started!");

        // Try standard AJAX POST request first
        var xhr = new XMLHttpRequest();
        xhr.open('POST', 'http://127.0.0.1:9090/api/install', true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.timeout = 3000;

        xhr.onload = function() {
            statusText.innerText = "Queued! Check PS4 Notifications.";
            statusText.style.color = "#00ff00";
            btn.disabled = false;
        };

        xhr.onerror = function() {
            useHiddenFrameFallback();
        };

        xhr.ontimeout = function() {
            useHiddenFrameFallback();
        };

        xhr.send(JSON.stringify({ type: "direct", uri: pkgUrl }));
    }

    // This silently submits the request via a hidden frame so the page won't turn blank white
    function useHiddenFrameFallback() {
        var statusText = document.getElementById('status-text');
        statusText.innerText = "Processing background installer...";
        statusText.style.color = "#00ff00";

        var form = document.createElement('form');
        form.action = "http://127.0.0.1:9090/api/install?uri=" + encodeURIComponent(pkgUrl);
        form.method = "GET";
        form.target = "hidden-iframe";
        
        document.body.appendChild(form);
        form.submit();
        document.body.removeChild(form);

        setTimeout(function() {
            statusText.innerText = "Package sent! Press PS Button to check downloads.";
            document.getElementById('install-btn').disabled = false;
        }, 2000);
    }
</script>
</body>
</html>
