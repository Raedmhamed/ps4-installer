<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 GoldHEN Store Installer</title>
    <style>
        body {
            background: #0f0f13;
            color: #ffffff;
            font-family: sans-serif;
            text-align: center;
            padding: 30px;
            margin: 0;
        }
        .container {
            background: #1e1e2d;
            border: 2px solid #0070d1;
            padding: 30px;
            border-radius: 12px;
            max-width: 400px;
            margin: 40px auto;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            color: #0070d1;
        }
        .subtitle {
            color: #a0a0b0;
            font-size: 13px;
            margin-bottom: 25px;
        }
        .btn {
            background: #0070d1;
            color: white;
            border: none;
            padding: 16px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
        }
        .btn:disabled {
            background: #4a4a5a;
            cursor: not-allowed;
        }
        #actionStatus {
            margin-top: 25px;
            font-weight: bold;
            font-size: 15px;
            padding: 12px;
            border-radius: 6px;
            display: none;
        }
        .success-box {
            background: rgba(0, 255, 204, 0.15);
            color: #00ffcc;
            border: 1px solid #00ffcc;
        }
        .error-box {
            background: rgba(255, 85, 85, 0.15);
            color: #ff5555;
            border: 1px solid #ff5555;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>PS4 Store Installer</h1>
        <div class="subtitle">Direct-to-Console Engine via Port 9090</div>

        <!-- Single true submission interaction button -->
        <button type="button" id="installBtn" class="btn" onclick="triggerInstall()">Install Store-R2.pkg</button>

        <div id="actionStatus"></div>
    </div>

    <script>
        function triggerInstall() {
            var statusDiv = document.getElementById('actionStatus');
            var btn = document.getElementById('installBtn');
            
            // Lock interface interaction immediately to protect execution cycle
            btn.disabled = true;
            statusDiv.className = "";
            statusDiv.style.display = "block";
            statusDiv.style.color = "#ffffff";
            statusDiv.innerText = "Connecting to internal GoldHEN server...";

            // Structural payload required by GoldHEN api backend
            var payload = {
                type: "direct",
                packages: ["https://githubusercontent.com"],
                path: "/data/pkg"
            };

            // Instantiate XMLHttp object natively recognized by the PS4 NetFront Browser engine
            var xhr = new XMLHttpRequest();
            xhr.open("POST", "http://127.0.0", true);
            xhr.setRequestHeader("Content-Type", "application/json");

            // Process true event returns directly from the GoldHEN background daemon
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4) {
                    // Check if server accepted package stream invocation request
                    if (xhr.status === 200 || xhr.status === 204 || xhr.status === 0) {
                        statusDiv.className = "success-box";
                        statusDiv.innerText = "SUCCESS! Check your PS4 home screen / Notifications > Downloads.";
                    } else {
                        statusDiv.className = "error-box";
                        statusDiv.innerText = "FAILED! (Server rejected payload structure or responded with code: " + xhr.status + ")";
                        btn.disabled = false;
                    }
                }
            };

            // Error trap handling for immediate execution feedback loops
            xhr.onerror = function () {
                statusDiv.className = "error-box";
                statusDiv.innerText = "CONNECTION FAILED! Make sure GoldHEN is loaded and 'Payload Server' is enabled in GoldHEN Settings.";
                btn.disabled = false;
            };

            // Dispatch command
            xhr.send(JSON.stringify(payload));
        }
    </script>

</body>
</html>
