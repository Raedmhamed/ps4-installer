<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 Homebrew Store Installer</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        .container {
            background-color: #1e1e1e;
            border: 1px solid #333;
            display: inline-block;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.7);
            max-width: 90%;
        }
        button {
            background-color: #0070d1;
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover {
            background-color: #005fb8;
        }
        #status {
            margin-top: 20px;
            font-weight: bold;
            color: #00ffcc;
            font-size: 15px;
        }
        .spinner {
            display: none;
            width: 30px;
            height: 30px;
            border: 4px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #00ffcc;
            animation: spin 1s ease-in-out infinite;
            margin: 15px auto 0 auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>PS4 Store Installer</h1>
        <p>Direct Background Queue Portal</p>

        <!-- Hidden frame to process the local POST request silently -->
        <iframe name="hidden_target" id="hidden_target" style="display:none;"></iframe>

        <!-- Form communicating directly with GoldHEN local daemon -->
        <form id="installForm" action="http://127.0.0.1:9090/api/install" method="POST" target="hidden_target">
            <input type="hidden" name="type" value="direct">
            <input type="hidden" name="packages" id="pkgPayload">
            <button type="submit" onclick="startLoading()">Install Store-R2.pkg</button>
        </form>

        <div class="spinner" id="loadingSpinner"></div>
        <div id="status">Ready to install.</div>
    </div>

    <script>
        // Direct Raw Package URL for Homebrew Store (23MB)
        var pkgUrl = "https://raw.githubusercontent.com/Raedmhamed/ps4-games-raed/main/Store-R2.pkg";

        // Pre-format the package payload array
        document.getElementById('pkgPayload').value = JSON.stringify([pkgUrl]);

        function startLoading() {
            var statusEl = document.getElementById('status');
            var spinnerEl = document.getElementById('loadingSpinner');
            
            spinnerEl.style.display = "block";
            statusEl.innerText = "Transmitting to GoldHEN daemon...";

            // Simulated feedback timer since iframe responses are restricted by local CORS
            setTimeout(function() {
                spinnerEl.style.display = "none";
                statusEl.innerText = "Request dispatched! Check PS4 Notifications > Downloads.";
            }, 3000);
        }
    </script>

</body>
</html>
