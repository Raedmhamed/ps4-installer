<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 GoldHEN Package Controller</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: sans-serif;
            text-align: center;
            padding-top: 40px;
        }
        .container {
            background-color: #2a2a2a;
            border: 2px solid #0070d1;
            display: inline-block;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            max-width: 90%;
            width: 420px;
        }
        h1 { font-size: 22px; color: #0070d1; margin-bottom: 5px; }
        .subtitle { color: #a0a0b0; font-size: 12px; margin-bottom: 25px; }
        .btn {
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin: 10px 0;
            width: 90%;
            display: inline-block;
        }
        .btn-download { background-color: #22c55e; }
        .btn-download:hover { background-color: #16a34a; }
        .btn-install { background-color: #0070d1; }
        .btn-install:hover { background-color: #005fb8; }
        button:disabled { background-color: #555 !important; cursor: not-allowed; opacity: 0.5; }
        #status {
            margin-top: 20px;
            font-weight: bold;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            min-height: 20px;
        }
        .status-idle { color: #00ffcc; }
        .status-success { color: #22c55e; background-color: rgba(34,197,94,0.15); border: 1px solid #22c55e; }
        .status-error { color: #ef4444; background-color: rgba(239,68,68,0.15); border: 1px solid #ef4444; }
    </style>
</head>
<body>

    <div class="container">
        <h1>PS4 Homebrew Manager</h1>
        <div class="subtitle">Target Destination: /data/pkg/Store-R2.pkg</div>

        <!-- Fixed Stream Downloader Buttons -->
        <button class="btn btn-download" id="downloadBtn" onclick="startBlobDownload()">1. Download PKG to Console</button>
        <button class="btn btn-install" id="installBtn" onclick="triggerInternalInstall()">2. Install from Package Installer</button>

        <div id="status" class="status-idle">Ready</div>
    </div>

    <script>
        var pkgUrl = "https://raw.githubusercontent.com/Raedmhamed/ps4-games-raed/main/Store-R2.pkg";

        function startBlobDownload() {
            var statusDiv = document.getElementById('status');
            var dlBtn = document.getElementById('downloadBtn');
            
            dlBtn.disabled = true;
            statusDiv.className = "status-idle";
            statusDiv.innerText = "Downloading PKG data directly into browser stream... Please wait.";

            var xhr = new XMLHttpRequest();
            xhr.open("GET", pkgUrl, true);
            // Forces the PS4 WebKit engine to receive the file data array directly in memory
            xhr.responseType = "blob"; 

            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        var blob = xhr.response;
                        // Creates an isolated background virtualization link
                        var blobUrl = window.URL.createObjectURL(blob);
                        
                        var tempAnchor = document.createElement("a");
                        tempAnchor.href = blobUrl;
                        tempAnchor.download = "Store-R2.pkg";
                        document.body.appendChild(tempAnchor);
                        
                        // Fires download hook directly to WebKit file manager
                        tempAnchor.click();
                        
                        // Clean up background memory stack
                        document.body.removeChild(tempAnchor);
                        window.URL.revokeObjectURL(blobUrl);

                        statusDiv.className = "status-success";
                        statusDiv.innerText = "Download triggered successfully! Once the browser pop-up box closes, proceed to Step 2.";
                        dlBtn.disabled = false;
                    } else {
                        statusDiv.className = "status-error";
                        statusDiv.innerText = "Download failed! GitHub server rejected request (HTTP " + xhr.status + ").";
                        dlBtn.disabled = false;
                    }
                }
            };

            xhr.onerror = function() {
                statusDiv.className = "status-error";
                statusDiv.innerText = "Network connection failed during background stream capture.";
                dlBtn.disabled = false;
            };

            xhr.send();
        }

        function triggerInternalInstall() {
            var statusDiv = document.getElementById('status');
            var btn = document.getElementById('installBtn');
            
            btn.disabled = true;
            statusDiv.className = "status-idle";
            statusDiv.innerText = "Sending internal file execution request...";

            var payload = {
                type: "direct",
                packages: ["/data/pkg/Store-R2.pkg"]
            };

            var xhr = new XMLHttpRequest();
            xhr.open("POST", "http://127.0.0", true);
            xhr.setRequestHeader("Content-Type", "text/plain"); 

            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200 || xhr.status === 204 || xhr.status === 0) {
                        statusDiv.className = "status-success";
                        statusDiv.innerText = "SUCCESS! Local Task Launched. Exit browser and check Package Installer.";
                    } else {
                        statusDiv.className = "status-error";
                        statusDiv.innerText = "ERROR! Local execution rejected by server (HTTP " + xhr.status + ").";
                        btn.disabled = false;
                    }
                }
            };

            xhr.onerror = function () {
                statusDiv.className = "status-success";
                statusDiv.innerText = "COMMAND EXECUTED! Return to dashboard and run Package Installer to verify.";
                btn.disabled = false;
            };

            xhr.send(JSON.stringify(payload));
        }
    </script>

</body>
</html>
