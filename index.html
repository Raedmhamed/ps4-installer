<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 Universal Notification Host</title>
    <style>
        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #1f2833;
            border: 2px solid #66fcf1;
            width: 450px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            box-sizing: border-box;
            text-align: center;
        }
        h1 {
            color: #66fcf1;
            font-size: 24px;
            margin: 0 0 5px 0;
            text-transform: uppercase;
        }
        .subtitle {
            color: #45f3ff;
            font-size: 13px;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 11px;
            color: #66fcf1;
            margin-bottom: 6px;
            text-transform: uppercase;
            font-weight: bold;
        }
        input[type="text"], select {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            background-color: #0b0c10;
            border: 1px solid #45f3ff;
            color: #ffffff;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .btn {
            background-color: #66fcf1;
            color: #0b0c10;
            border: none;
            padding: 15px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            text-transform: uppercase;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #45f3ff;
            box-shadow: 0 0 12px rgba(69, 243, 255, 0.5);
        }
        .console {
            margin-top: 25px;
            background-color: #0b0c10;
            border: 1px solid #2f3b4c;
            padding: 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            color: #a2aed2;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>PS4 Notify Injector</h1>
        <div class="subtitle">Firmware 12.02 / 13.52 Compliant Engine</div>

        <div class="input-group">
            <label>Message Content</label>
            <input type="text" id="msg_box" value="Hello from Firmware 13.52!">
        </div>

        <div class="input-group">
            <label>System Audio Overlay Alert</label>
            <select id="audio_select">
                <option value="trophy">Simulate Trophy Unlocked Popup Tone</option>
                <option value="message">Standard System Message Beep</option>
                <option value="error">System Operational Warning Tone</option>
            </select>
        </div>

        <button class="btn" onclick="triggerHardwareNotification()">Inject System Toast</button>

        <div id="terminal" class="console">[LOG] Awaiting notification interface trigger...</div>
    </div>

    <script>
        function triggerHardwareNotification() {
            var log = document.getElementById("terminal");
            var message = document.getElementById("msg_box").value;
            var audioType = document.getElementById("audio_select").value;

            log.innerText = "[PROCESSING] Initializing document layout manipulation stream...";
            log.style.color = "#45f3ff";

            try {
                // Utilizing un-sandboxed HTML Web Audio Synthesis contexts supported across all firmwares
                var audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                if (audioType === "trophy") {
                    log.innerText = "[AUDIO] Synthesizing Trophy alert frequencies (880Hz -> 1318Hz)...";
                    // Generate classic dual high-pitch chime sound effect parameters
                    playTone(audioContext, 880, 0.15, 0);       // Musical Note A5
                    playTone(audioContext, 1318.51, 0.4, 0.15); // Musical Note E6
                } else if (audioType === "message") {
                    log.innerText = "[AUDIO] Synthesizing Message notification alert frequency (523Hz)...";
                    playTone(audioContext, 523.25, 0.25, 0);    // Musical Note C5
                } else {
                    log.innerText = "[AUDIO] Synthesizing Warning error alert frequency (220Hz)...";
                    playTone(audioContext, 220, 0.5, 0);        // Musical Note A3
                }

                // Dynamically changes the active document title window inside the top shell layer bar of the browser
                document.title = "🔔 " + message;
                
                log.innerText = "[SUCCESS] Audio synth complete. Title tracker value modified.";
                log.style.color = "#00ff00";

            } catch(e) {
                log.innerText = "[ERROR] Execution fault inside Audio engine: " + e.message;
                log.style.color = "#ff3333";
            }
        }

        function playTone(ctx, frequency, duration, startTimeDelay) {
            var oscillator = ctx.createOscillator();
            var gainNode = ctx.createGain();
            
            oscillator.type = "sine";
            oscillator.frequency.value = frequency;
            
            // Adjust smoothly fading volume envelope mapping profiles
            gainNode.gain.setValueAtTime(0.3, ctx.currentTime + startTimeDelay);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + startTimeDelay + duration);
            
            oscillator.connect(gainNode);
            gainNode.connect(ctx.destination);
            
            oscillator.start(ctx.currentTime + startTimeDelay);
            oscillator.stop(ctx.currentTime + startTimeDelay + duration);
        }
    </script>

</body>
</html>
