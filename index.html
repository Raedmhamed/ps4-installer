<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoldHEN One-Click Web Zone</title>
<style>
body { background: #121212; color: white; font-family: sans-serif; text-align: center; padding: 40px 12px; margin: 0; }
h1 { color: #0070d2; margin-bottom: 5px; }
.subtitle { color: #aaa; margin-top: 0; font-size: 14px; margin-bottom: 30px; }
.pkg-card { background: #1e1e1e; padding: 25px; border-radius: 12px; border: 1px solid #333; margin: 15px; display: inline-block; width: 280px; text-align: left; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
.pkg-title { font-size: 18px; font-weight: bold; color: #fff; margin-bottom: 5px; }
button { padding: 12px; font-size: 15px; background: #0070d2; color: white; border: none; cursor: pointer; border-radius: 6px; font-weight: bold; width: 100%; margin-top: 15px; }
button:hover { background: #0056a3; }
button:disabled { background: #444; cursor: not-allowed; }
.status-msg { margin-top: 12px; font-style: italic; color: #ffcc00; font-size: 14px; text-align: center; font-weight: bold; }
.progress-bar-container { width: 100%; background-color: #333; border-radius: 6px; margin-top: 10px; display: none; }
.progress-bar { width: 0%; height: 10px; background-color: #00ff00; border-radius: 6px; transition: width 0.1s; }
</style>
</head>
<body>

    <h1>Custom One-Click PKG Zone</h1>
    <p class="subtitle">Secure GoldHEN Background Installation Portal</p>

    <div class="pkg-card">
        <div class="pkg-title">📦 DolphinPS4 Emulator</div>
        <p style="color:#aaa; font-size:13px; margin:5px 0;">Firmware: Supported Environment</p>
        
        <button id="download-btn" onclick="startGoldHENBackgroundInstall(this)">
            Click to Install
        </button>
        
        <div class="progress-bar-container" id="progress-container">
            <div class="progress-bar" id="my-bar"></div>
        </div>
        <div class="status-msg" id="status-text">Ready</div>
    </div>

    <iframe name="hidden-iframe" id="hidden-iframe" style="display:none;"></iframe>

    <script>
    var directPkgUrl = "https://github.com/Raedmhamed/ps4-games-raed/releases/download/Testing/DolphinPS4-v04.16.pkg";

    function sendPS4Notification(msg) {
        try {
            var xhr = new XMLHttpRequest();
            xhr.open('POST', 'http://127.0.0.1:9090/api/notify', true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.send(JSON.stringify({ message: msg }));
        } catch(e) {}
    }

    window.addEventListener('DOMContentLoaded', function() {
        sendPS4Notification("GoldHEN Zone Loaded Successfully.");
    });

    function startGoldHENBackgroundInstall(buttonEl) {
        var statusText = document.getElementById('status-text');
        var progressContainer = document.getElementById('progress-container');
        var progressBar = document.getElementById('my-bar');
        
        buttonEl.disabled = true;
        progressContainer.style.display = "block";
        statusText.innerText = "Connecting to GoldHEN daemon...";
        statusText.style.color = "#ffcc00";

        sendPS4Notification("Download Started! Please wait...");

        var progress = 0;
        var progressInterval = setInterval(function() {
            if (progress < 90) {
                progress += 10;
                progressBar.style.width = progress + '%';
                statusText.innerText = "Queueing to System Installer: " + progress + "%";
            }
        }, 150);

        // Fallback method: Direct URL parameter pass via hidden frame to force system handler
        var form = document.createElement('form');
        form.action = "http://127.0.0.1:9090/api/install?uri=" + encodeURIComponent(directPkgUrl);
        form.method = "GET";
        form.target = "hidden-iframe";
        
        document.body.appendChild(form);
        form.submit();
        document.body.removeChild(form);

        setTimeout(function() {
            clearInterval(progressInterval);
            progressBar.style.width = '100%';
            statusText.innerText = "Package sent to System Installer!";
            statusText.style.color = "#00ff00";
            sendPS4Notification("Installation Queued! Check Notifications.");
            buttonEl.disabled = false;
        }, 2500);
    }
    </script>
</body>
</html>
