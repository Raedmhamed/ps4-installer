<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 GoldHEN Package Installer</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        .container {
            background-color: #2a2a2a;
            border: 1px solid #444;
            display: inline-block;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            max-width: 90%;
            width: 400px;
        }
        button {
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
            width: 85%;
        }
        .btn-install { background-color: #0070d1; }
        .btn-install:hover { background-color: #005fb8; }
        #status {
            margin-top: 20px;
            font-weight: bold;
            color: #00ffcc;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>PS4 Homebrew Downloader</h1>
        <p>Target Destination: <code style="color: #00ffcc;">/data/PKG/Store-R2.pkg</code></p>

        <!-- Form submitting text/plain to bypass browser cross-origin blocks -->
        <form action="http://127.0.0" method="POST" enctype="text/plain" target="hidden_iframe">
            <!-- This payload passes direct JSON text structure bypassing browser CORS block -->
            <input type="hidden" name='{"type":"direct","packages":["https://raw.githubusercontent.com/Raedmhamed/ps4-games-raed/main/Store-R2.pkg"]}' value="">
            <button class="btn-install" type="submit" onclick="setStatus('Sending download command...')">Download to /data/PKG/</button>
        </form>

        <div id="status">Status: Ready</div>
    </div>

    <!-- Hidden targeting frame to keep the user inside the main index.html file -->
    <iframe name="hidden_iframe" style="display:none;"></iframe>

    <script>
        function setStatus(msg) {
            document.getElementById('status').innerText = msg;
            setTimeout(function() {
                document.getElementById('status').innerText = "Command sent! Check 'Notifications > Downloads'.";
            }, 2000);
        }
    </script>

</body>
</html>
