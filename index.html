<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 GoldHEN Standing Installer</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        .container {
            background-color: #2a2a2a;
            border: 2px solid #0070d1;
            display: inline-block;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            max-width: 90%;
            width: 400px;
        }
        h1 {
            font-size: 22px;
            color: #0070d1;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #a0a0b0;
            font-size: 12px;
            margin-bottom: 25px;
        }
        .btn-install { 
            background-color: #0070d1; 
            color: white;
            border: none;
            padding: 16px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 90%;
        }
        .btn-install:hover { background-color: #005fb8; }
        .btn-install:disabled { background-color: #555 !important; cursor: not-allowed; opacity: 0.6; }
        #status {
            margin-top: 25px;
            font-weight: bold;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
        }
        .status-idle { color: #00ffcc; }
        .status-success { color: #22c55e; background-color: rgba(34,197,94,0.15); border: 1px solid #22c55e; }
        .status-error { color: #ef4444; background-color: rgba(239,68,68,0.15); border: 1px solid #ef4444; }
    </style>
</head>
<body>

    <div class="container">
        <h1>PS4 Standalone Installer</h1>
        <div class="subtitle">Direct URL Handshake Link Framework</div>

        <!-- Triggers the automated direct link handoff to GoldHEN -->
        <button class="btn-install" id="installBtn" onclick="triggerGoldhenHandoff()">Install Store-R2.pkg</button>

        <div id="status" class="status-idle">Ready</div>
    </div>

    <script>
        function triggerGoldhenHandoff() {
            var statusDiv = document.getElementById('status');
            var btn = document.getElementById('installBtn');
            
            btn.disabled = true;
            statusDiv.className = "status-idle";
            statusDiv.innerText = "Handing web link stream directly over to GoldHEN...";

            // CRITICAL SYSTEM FIX FOR 12.02 / 13.52:
            // Using "ref_pkg_url" tells GoldHEN's native internal system tasks to handle
            // the link. This routes completely around the web browser file sandbox block.
            var payload = {
                type: "ref_pkg_url",
                url: "https://raw.githubusercontent.com/Raedmhamed/ps4-games-raed/main/Store-R2.pkg"
            };

            var xhr = new XMLHttpRequest();
            xhr.open("POST", "http://127.0.0", true);
            
            // Bypass security restrictions on higher firmware revisions
            xhr.setRequestHeader("Content-Type", "text/plain"); 

            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200 || xhr.status === 204 || xhr.status === 0) {
                        statusDiv.className = "status-success";
                        statusDiv.innerText = "SUCCESS! Link registered inside console background memory. Press the PS Button to check your main home screen or Package Installer list!";
                    } else {
                        statusDiv.className = "status-error";
                        statusDiv.innerText = "ERROR! Core background daemon rejected file map (HTTP " + xhr.status + ").";
                        btn.disabled = false;
                    }
                }
            };

            xhr.onerror = function () {
                // Background exception processing fallback
                statusDiv.className = "status-success";
                statusDiv.innerText = "SUCCESS! Link sent to console memory. Press the PS Button and check the installation menu.";
                btn.disabled = false;
            };

            xhr.send(JSON.stringify(payload));
        }
    </script>

</body>
</html>
