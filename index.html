<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 GoldHEN Portal</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        .container {
            background-color: #2a2a2a;
            border: 1px solid #444;
            display: inline-block;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        button {
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
        }
        .btn-install { background-color: #0070d1; }
        .btn-install:hover { background-color: #005fb8; }
        .btn-notify { background-color: #28a745; }
        .btn-notify:hover { background-color: #218838; }
        #status {
            margin-top: 20px;
            font-weight: bold;
            color: #00ffcc;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>PS4 GoldHEN Portal</h1>
        <p>Direct API Test & Control Panel</p>

        <!-- Notification Trigger -->
        <button class="btn-notify" onclick="sendNotification('Hello from PS4 Web Portal!')">Test PS4 Notification</button>

        <br><br>

        <!-- Install Trigger -->
        <button class="btn-install" onclick="triggerInstall()">Install Store-R2.pkg</button>

        <div id="status"></div>
    </div>

    <script>
        var directPkgUrl = "https://raw.githubusercontent.com/Raedmhamed/ps4-games-raed/main/Store-R2.pkg";

        // Function to trigger a PS4 System Notification Popup
        function sendNotification(messageText) {
            var statusEl = document.getElementById('status');
            statusEl.innerText = "Sending notification command...";

            var payload = {
                "message": messageText
            };

            fetch("http://127.0.0.1:9090/api/notify", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            })
            .then(function(response) {
                statusEl.innerText = "Notification request sent! Check top-left of PS4 screen.";
            })
            .catch(function(error) {
                // Fallback for no-cors/browser origin blocks
                statusEl.innerText = "Notification request sent to daemon.";
            });
        }

        // Function to send Package Install Command
        function triggerInstall() {
            var statusEl = document.getElementById('status');
            statusEl.innerText = "Sending install payload to GoldHEN...";

            var payload = {
                "type": "direct",
                "packages": [directPkgUrl]
            };

            fetch("http://127.0.0.1:9090/api/install", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            })
            .then(function(response) {
                statusEl.innerText = "Install command processed.";
            })
            .catch(function(error) {
                statusEl.innerText = "Install command dispatched to daemon.";
            });

            // Send notification confirming the attempt
            sendNotification("Package sent to System Installer!");
        }
    </script>

</body>
</html>
