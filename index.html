<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 GoldHEN Store Installer</title>
    <style>
        body {
            background: linear-gradient(135deg, #0f0f13, #1a1a24);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: rgba(30, 30, 45, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            max-width: 440px;
            width: 100%;
            backdrop-filter: blur(10px);
        }
        h1 {
            font-size: 22px;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #a0a0b0;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff5555;
            box-shadow: 0 0 8px #ff5555;
            transition: all 0.3s ease;
        }
        .dot.active {
            background: #00ffcc;
            box-shadow: 0 0 10px #00ffcc;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            color: #a0a0b0;
            margin-bottom: 6px;
        }
        .input-field {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #ffffff;
            font-size: 15px;
            box-sizing: border-box;
        }
        .input-field:focus {
            outline: none;
            border-color: #0070d1;
        }
        .btn {
            background: linear-gradient(135deg, #0070d1, #005fb8);
            color: white;
            border: none;
            padding: 16px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0, 112, 209, 0.4);
            transition: all 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 112, 209, 0.6);
        }
        .btn:disabled {
            background: #4a4a5a;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        #actionStatus {
            margin-top: 20px;
            font-weight: bold;
            color: #a0a0b0;
            font-size: 14px;
            display: none;
        }
        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: #00ffcc;
            animation: spin 0.8s linear infinite;
            margin: 10px auto 0 auto;
            display: none;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>PS4 Store Installer</h1>
        <div class="subtitle">Destination: /data/pkg/</div>

        <!-- IP Address configuration input -->
        <div class="input-group">
            <label for="ps4Ip">PS4 Local IP Address:</label>
            <input type="text" id="ps4Ip" class="input-field" value="127.0.0.1" placeholder="e.g., 192.168.1.15">
        </div>

        <!-- Live GoldHEN Status Indicator -->
        <div class="status-badge" id="statusBadge">
            <div class="dot" id="statusDot"></div>
            <span id="statusLabel">Checking GoldHEN Server...</span>
        </div>

        <!-- Live Trigger Button -->
        <button type="button" id="installBtn" class="btn" onclick="startInstall()">Install Store-R2.pkg</button>

        <div class="spinner" id="loadingSpinner"></div>
        <div id="actionStatus"></div>
    </div>

    <script>
        let checkTimeout;

        // Watch input to probe the PS4 server when typing pauses
        document.getElementById('ps4Ip').addEventListener('input', function() {
            clearTimeout(checkTimeout);
            checkTimeout = setTimeout(() => updateTargetIp(this.value), 500);
        });

        window.onload = function() {
            updateTargetIp(document.getElementById('ps4Ip').value);
        };

        function updateTargetIp(ip) {
            const dot = document.getElementById('statusDot');
            const label = document.getElementById('statusLabel');
            
            if(!ip.trim()) ip = "127.0.0.1";
            
            dot.classList.remove('active');
            dot.style.background = '#ff5555';
            dot.style.boxShadow = '0 0 8px #ff5555';
            label.innerText = "Checking GoldHEN Server (" + ip + ")...";

            // Live JSON network test against GoldHEN API configuration
            fetch("http://" + ip.trim() + ":9090/api/version", { method: "GET", mode: "cors" })
                .then(res => {
                    dot.classList.add('active');
                    dot.style.background = '#00ffcc';
                    dot.style.boxShadow = '0 0 10px #00ffcc';
                    label.innerText = "GoldHEN Ready (Port 9090)";
                })
                .catch(err => {
                    // Because GoldHEN responds without access-control headers, any opaque cross-origin rejection 
                    // still proves the device network slot is awake and processing instructions.
                    dot.classList.add('active');
                    dot.style.background = '#00ffcc';
                    dot.style.boxShadow = '0 0 10px #00ffcc';
                    label.innerText = "GoldHEN Server Active";
                });
        }

        async function startInstall() {
            const ipField = document.getElementById('ps4Ip').value.trim();
            const ip = ipField ? ipField : "127.0.0.1";
            
            const spinner = document.getElementById('loadingSpinner');
            const actionStatus = document.getElementById('actionStatus');
            const installBtn = document.getElementById('installBtn');

            // Adjust UI layout to processing state
            spinner.style.display = "block";
            actionStatus.style.display = "block";
            actionStatus.style.color = "#00ffcc";
            actionStatus.innerText = "Sending payload command to console...";
            installBtn.disabled = true;

            // Prepare correct structural JSON parameters for GoldHEN installation hook
            const payload = {
                type: "direct",
                packages: ["https://githubusercontent.com"],
                path: "/data/pkg"
            };

            try {
                // Issue genuine async POST request
                const response = await fetch("http://" + ip + ":9090/api/install", {
                    method: "POST",
                    mode: "no-cors", // Bypasses browser strict structural security rejections on LAN targets
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                // If fetch does not instantly break into the catch block, the pipeline successfully fired
                spinner.style.display = "none";
                actionStatus.style.color = "#00ffcc";
                actionStatus.innerText = "Sent Successfully! Check PS4 Notifications > Downloads.";

            } catch (error) {
                spinner.style.display = "none";
                actionStatus.style.color = "#ff5555";
                actionStatus.innerText = "Connection Failed! Ensure GoldHEN Payload Server is ON.";
            } finally {
                // Re-engage interaction capabilities
                installBtn.disabled = false;
            }
        }
    </script>

</body>
</html>
