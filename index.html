<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 GoldHEN Direct Installer</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: sans-serif;
            text-align: center;
            padding-top: 40px;
        }
        .container {
            background-color: #2a2a2a;
            border: 1px solid #444;
            display: inline-block;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            max-width: 90%;
        }
        button {
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
        }
        .btn-notify { background-color: #28a745; }
        .btn-install { background-color: #0070d1; }
    </style>
</head>
<body>

    <div class="container">
        <h1>PS4 GoldHEN Control</h1>

        <!-- Test Notification Form -->
        <form action="http://127.0.0.1:9090/api/notify" method="POST" target="_self">
            <input type="hidden" name="message" value="Portal connected successfully!">
            <button class="btn-notify" type="submit">1. Test Notification</button>
        </form>

        <br>

        <!-- Package Install Form -->
        <form action="http://127.0.0.1:9090/api/install" method="POST" target="_self">
            <input type="hidden" name="type" value="direct">
            <input type="hidden" name="packages" value='["https://raw.githubusercontent.com/Raedmhamed/ps4-games-raed/main/Store-R2.pkg"]'>
            <button class="btn-install" type="submit">2. Install Store-R2.pkg</button>

</html>
