<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>PS5 WebKitty Jailbreak Test</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background-color: #111827; color: #fff;
  font-family: "Segoe UI", system-ui, Arial, sans-serif;
  min-height: 100vh; padding: 12px;
  display: flex; flex-direction: column;
}
.mainContainer { max-width: 960px; margin: 0 auto; width: 100%; }

/* initial screen */
#initial-screen { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; transition: opacity .7s; }
#pslogo { background: none; border: none; cursor: pointer; padding: 0; }
#ps-logo-container { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; border-radius: 9999px; background: rgba(255,255,255,.05); transition: all .3s; transform: scale(1); }
#ps-logo-container:hover { background: rgba(255,255,255,.1); transform: scale(1.02); }
#ps-logo { width: 128px; height: 128px; transition: all .5s ease-in-out; }
#click-to-start-text { color: rgba(255,255,255,.7); font-size: 18px; margin-top: 16px; }
#stopAutoJb { margin-top: 8px; background: #dc2626; color: #fff; padding: 12px 16px; border-radius: 6px; font-weight: 600; border: none; cursor: pointer; display: none; }
#stopAutoJb:hover { background: #b91c1c; }
.compatibilityMessage { text-align: center; }
#PS4FW, #exploitChainLabel { color: rgba(255,255,255,.7); font-size: 18px; margin: 16px 0; }

/* exploit screen */
#exploit-main-screen { display: flex; width: 100%; }
#exploitContainer { display: grid; grid-template-columns: 1fr; gap: 16px; width: 100%; }
@media (min-width: 768px) { #exploitContainer { grid-template-columns: 1fr 1fr; } }
.panel { background: #1f2937; padding: 24px; border-radius: 8px; display: flex; flex-direction: column; height: 100%; gap: 16px; }
.panel h2 { font-size: 20px; font-weight: 600; }
#DebugConsole { flex-grow: 1; min-height: 150px; background: rgba(0,0,0,.5); padding: 16px; border-radius: 8px; overflow-y: auto; font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
#console { white-space: pre-wrap; }
#console span { display: block; }
#console center { color: #6b7280; }

/* controls */
.row { display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; }
.henLabel { display: flex; align-items: center; padding: 4px 8px; border-radius: 6px; background: rgba(31,41,55,.6); cursor: pointer; border: 2px solid transparent; }
.henLabel input { accent-color: #3b82f6; width: 16px; height: 16px; margin-left: 8px; }
.henLabel span { font-size: 16px; font-weight: 600; color: rgba(255,255,255,.9); }
#exploitRun, #autoJbTempStop { display: flex; align-items: center; justify-content: center; padding: 8px; border-radius: 9999px; border: none; cursor: pointer; color: #fff; }
#exploitRun { background: #2563eb; } #exploitRun:hover { background: #1d4ed8; }
#autoJbTempStop { background: #ca8a04; display: none; } #autoJbTempStop:hover { background: #a16207; }
#successRate { font-size: 16px; font-weight: 600; background: none; border: none; color: #fff; cursor: pointer; white-space: nowrap; }
#successRate:hover { text-decoration: underline; }

/* tabs */
.tabs { display: flex; border-bottom: 1px solid #374151; width: 100%; }
.tabs button { flex: 1; padding: 16px; border: none; background: none; color: #9ca3af; font-size: 14px; font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent; }
.tabs button:hover { color: #d1d5db; border-color: #4b5563; }
.tabs button.active { color: #3b82f6; border-color: #3b82f6; }
.tabpanel { display: none; padding: 16px; }
.tabpanel.active { display: block; }

/* console log colors */
.log-info { color: #9ca3af; }
.log-ok { color: #4ade80; }
.log-warn { color: #facc15; }
.log-err { color: #f87171; }

/* footer */
footer { text-align: center; margin-top: 16px; font-size: 11px; color: #6b7280; }
a.link { color: #60a5fa; text-decoration: none; }
</style>
</head>
<body>
<div class="mainContainer">

<!-- Initial screen -->
<section id="initial-screen">
  <header style="position:absolute;top:24px;left:24px;display:flex;gap:12px;z-index:10;">
    <button onclick="settingsPopup()" title="Settings" style="padding:8px;border-radius:8px;background:#1f2937;color:rgba(255,255,255,.8);border:none;cursor:pointer;">
      <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor"><path d="M8 4.754a3.246 3.246 0 1 0 0 6.492 3.246 3.246 0 0 0 0-6.492zM5.754 8a2.246 2.246 0 1 1 4.492 0 2.246 2.246 0 0 1-4.492 0z"/></svg>
    </button>
  </header>

  <button id="pslogo" onclick="startJailbreak()">
    <div id="ps-logo-container">
      <svg id="ps-logo" viewBox="0 0 32 32" fill="#3B82F6" xmlns="http://www.w3.org/2000/svg">
        <g>
          <path d="M0.69116 21.9548C-0.506476 22.7935 -0.284724 24.2384 2.44769 25.1419C5.18011 26.0455 8.35603 26.2323 11.1505 25.729C11.0707 25.729 11.3102 25.729 11.1505 25.729V22.8774L8.43588 23.8C7.39792 24.1355 6.35997 24.2194 5.32202 23.9677C4.5236 23.7161 4.68328 23.2129 5.64139 22.7935L11.1505 20.7806V17.6774L3.48565 20.4452C2.52754 20.7806 1.56943 21.2839 0.69116 21.9548ZM19.2146 9.37419V17.5097C22.4881 19.1871 25.0431 17.5097 25.0431 13.1484C25.0431 8.70323 23.5261 6.69032 19.1348 5.09677C16.8193 4.25806 14.4241 3.50323 12.0288 3V27.2387L17.6178 29V8.61935C17.6178 7.69677 17.6178 7.02581 18.2565 7.27742C19.1348 7.52903 19.2146 8.45161 19.2146 9.37419ZM29.5941 20.0258C27.2787 19.1871 24.8036 18.8516 22.4083 19.1032C21.0779 19.1906 19.8294 19.5869 18.5759 20.0258V23.2968L23.7656 21.2839C24.8036 20.9484 25.8415 20.8645 26.8795 21.1161C27.6779 21.3677 27.5182 21.871 26.5601 22.2903L18.5759 25.3935V28.5806L29.5941 24.3032C30.3925 23.9677 31.1111 23.5484 31.7499 22.8774C32.3088 22.0387 32.0692 20.8645 29.5941 20.0258Z" />
        </g>
      </svg>
    </div>
  </button>
  <h3 id="click-to-start-text">Click PS to start jailbreak</h3>
  <button id="stopAutoJb" onclick="stopJailbreak()">Stop Auto Jailbreak</button>
  <div class="compatibilityMessage">
    <p id="PS4FW">PS5 firmware: unknown</p>
    <p id="exploitChainLabel">Exploit chain: WebKit probe</p>
  </div>
</section>

<!-- Exploit screen -->
<section id="exploit-main-screen" style="display:none;">
  <div id="exploitContainer">
    <!-- Exploit console panel -->
    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:baseline;">
        <h2>Exploit status</h2>
        <button id="successRate" onclick="clearStats()">Success rate</button>
      </div>
      <div id="DebugConsole">
        <pre id="console"><center>--</center></pre>
      </div>
      <div class="row">
        <label class="henLabel">
          <input type="radio" name="hen" value="GoldHEN" onchange="saveJbFlavor(this.name,this.value)">
          <span>GoldHEN</span>
        </label>
        <label class="henLabel">
          <input type="radio" name="hen" value="PS4HEN" onchange="saveJbFlavor(this.name,this.value)">
          <span>PS4HEN</span>
        </label>
        <button id="exploitRun" onclick="runOneAttempt()" title="Run">
          <svg width="25" height="25" viewBox="0 0 16 16" fill="currentColor"><path d="M10.804 8 5 4.633v6.734L10.804 8zm.792-.696a.802.802 0 0 1 0 1.392l-6.363 3.692C4.713 12.69 4 12.345 4 11.692V4.308c0-.653.713-.998 1.233-.696l6.363 3.692z"/></svg>
        </button>
        <button id="autoJbTempStop" onclick="stopJailbreak()" title="Pause">Pause Auto-Jailbreak</button>
      </div>
    </div>
    <!-- Notification debug panel (real test, no separate section) -->
    <div class="panel">
      <h2>Notification Debug</h2>
      <div id="notifDebug" style="font-size:12px;color:#9ca3af;">Permission: — · Supported: —</div>
      <div style="margin-top:8px;font-size:12px;color:#9ca3af;">Notification test runs automatically during each attempt and is logged above.</div>
      <div style="margin-top:16px;">
        <h2>Logs (send to Elena)</h2>
        <textarea id="logsBox" readonly style="width:100%;height:160px;margin-top:8px;background:rgba(0,0,0,.5);color:#a2aed2;border:1px solid #1f3355;border-radius:8px;padding:8px;font-family:monospace;font-size:11px;resize:vertical;"></textarea>
        <div class="row" style="justify-content:flex-start;margin-top:8px;">
          <button onclick="copyLogs()" style="background:#2563eb;color:#fff;padding:8px 12px;border-radius:6px;border:none;cursor:pointer;font-weight:600;">Copy Logs</button>
          <button onclick="sendLogsToElena()" style="background:#16a34a;color:#fff;padding:8px 12px;border-radius:6px;border:none;cursor:pointer;font-weight:600;">Send to Elena</button>
        </div>
        <div id="sendStatus" style="margin-top:6px;font-size:11px;color:#9ca3af;"></div>
      </div>
    </div>
  </div>
</section>

<footer>
  PS5 WebKitty Jailbreak Test &middot;
  <a class="link" href="https://github.com/Raedmhamed/ps4-installer" target="_blank" rel="noopener">GitHub</a>
</footer>

<script>
"use strict";

var state = { running: false, stopFlag: false, logs: [], attempts: 0, successes: 0, autoRetry: true, lastAttemptErrors: 0 };

var consoleEl = document.getElementById('console');

function log(message, color) {
  if (!consoleEl) return;
  if (consoleEl.textContent.trim() === '--') consoleEl.textContent = '';
  var span = document.createElement('span');
  span.textContent = message + '\n';
  if (color) span.style.color = color;
  consoleEl.appendChild(span);
  state.logs.push((color ? '['+color+'] ' : '') + message);
  if (color === '#f87171') { state.lastAttemptErrors = (state.lastAttemptErrors || 0) + 1; }
  var panel = document.getElementById('DebugConsole');
  if (panel) panel.scrollTop = panel.scrollHeight;
  try { localStorage.setItem('ps5jb_logs', JSON.stringify(state.logs.slice(-500))); } catch(e){}
}

// Global error handlers (WebKitty style)
function reportGlobalError(title, details) {
  if (!consoleEl) return;
  if (consoleEl.textContent.trim() === '--') consoleEl.textContent = '';
  var entry = document.createElement('span');
  entry.style.color = '#f87171';
  entry.style.whiteSpace = 'pre-wrap';
  entry.textContent = title + '\n' + details + '\n\n';
  consoleEl.appendChild(entry);
  var panel = document.getElementById('DebugConsole');
  if (panel) panel.scrollTop = panel.scrollHeight;
}
window.onerror = function (msg, url, lineno, colno, error) {
  var stack = error && error.stack ? error.stack : 'No stack trace';
  var details = 'URL: ' + url + '\nLine: ' + lineno + ', Col: ' + colno + '\n\n' + stack;
  console.error('[onerror]', msg, url, lineno, colno, stack);
  reportGlobalError('Error: ' + msg, details);
  return true;
};
window.addEventListener('unhandledrejection', function (event) {
  var reason = event.reason;
  var msg = reason instanceof Error ? reason.message + '\n\nStack:\n' + reason.stack : String(reason);
  console.error('[unhandledrejection]', reason);
  reportGlobalError('Unhandled Promise Rejection:', msg);
});

function $(id){ return document.getElementById(id); }

function isPS5Web(){
  try { return /PlayStation\s*5/i.test(navigator.userAgent || ''); }
  catch(e){ return false; }
}

function now(){ return new Date().toLocaleTimeString(); }

function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

function saveJbFlavor(name, value){ try { localStorage.setItem(name, value); } catch(e){} }
function setGoldHENVer(v){ try { localStorage.setItem('goldhenVer', v); } catch(e){} }
function exploitChain(v){ try { localStorage.setItem('exploitChain', v); } catch(e){} }
function setAutoJb(v){ state.autoRetry = v; }
function setAutoJbRetry(v){ state.autoRetry = v; }
function setBareboneJB(v){ try { localStorage.setItem('bareboneJB', v); } catch(e){} }
function setReloadAfterJb(v){ try { localStorage.setItem('reloadAfterJb', v); } catch(e){} }
function setAdvancedPayloads(v){}
function changeAutoJbTimer(){}
function settingsPopup(){ /* noop */ }
function clearStats(){ state.attempts = 0; state.successes = 0; updateRate(); }
function updateRate(){
  var sr = $('successRate');
  if (sr) sr.textContent = 'Success rate: ' + (state.attempts ? Math.round(state.successes/state.attempts*100) : 0) + '% (' + state.successes + '/' + state.attempts + ')';
}

function updateNotifDebug(){
  var supp = ("Notification" in window) ? "yes" : "no";
  var perm = ("Notification" in window) ? Notification.permission : "n/a";
  var el = $('notifDebug');
  if (el) el.textContent = "Permission: " + perm + " · Supported: " + supp;
}

/* Real notification debug test (runs during attempt) */
async function notificationDebugTest(attempt){
  log(now() + " [INF] Notification debug test start", "#9ca3af");
  if (!("Notification" in window)){
    log(now() + " [ERR] Notification API not supported", "#f87171");
    return;
  }
  log(now() + " [OK ] Notification API supported, permission=" + Notification.permission, "#4ade80");
  // request permission if default
  if (Notification.permission === "default"){
    try {
      var p = await Notification.requestPermission();
      log(now() + " [INF] requestPermission -> " + p, "#9ca3af");
    } catch(e){
      log(now() + " [ERR] requestPermission FAILED: " + e.message, "#f87171");
      return;
    }
  }
  if (Notification.permission !== "granted"){
    log(now() + " [WRN] Permission not granted (" + Notification.permission + ")", "#facc15");
    return;
  }
  // attempt to send a real notification
  try {
    var n = new Notification("PS5 WebKitty Test", { body: "Debug notification attempt " + attempt, tag: "wk-" + attempt, renotify: true });
    log(now() + " [OK ] Notification sent (title=PS5 WebKitty Test)", "#4ade80");
    n.onclick = function(){ log(now() + " [INF] Notification clicked", "#9ca3af"); };
    n.onerror = function(e){ log(now() + " [ERR] Notification error event", "#f87171"); };
    n.onclose = function(){ log(now() + " [INF] Notification closed", "#9ca3af"); };
  } catch(e){
    log(now() + " [ERR] Notification send FAILED: " + e.message, "#f87171");
  }
  updateNotifDebug();
}

async function runOneAttempt(){
  state.attempts++;
  state.lastAttemptErrors = 0;
  updateRate();
  log(now() + " [WRN] === Attempt " + state.attempts + " started ===", "#facc15");

  // environment
  log(now() + " [INF] UA: " + navigator.userAgent, "#9ca3af");
  log(now() + " [INF] Platform: " + navigator.platform + " | Lang: " + navigator.language, "#9ca3af");

  // notification debug test (real)
  await notificationDebugTest(state.attempts);

  // memory
  try {
    var buf = new ArrayBuffer(1024*1024);
    var view = new Uint8Array(buf);
    view[0] = 0x41;
    log(now() + " [OK ] ArrayBuffer 1MB alloc+write OK", "#4ade80");
  } catch(e){ log(now() + " [ERR] ArrayBuffer FAILED: " + e.message, "#f87171"); }

  // WebAssembly
  if (typeof WebAssembly !== "undefined"){
    log(now() + " [OK ] WebAssembly supported", "#4ade80");
    try {
      var wasmBytes = new Uint8Array([0,97,115,109,1,0,0,0]);
      WebAssembly.compile(wasmBytes).then(function(){ log(now() + " [OK ] WASM compile OK", "#4ade80"); }).catch(function(e){ log(now() + " [ERR] WASM compile FAILED: " + e.message, "#f87171"); });
    } catch(e){ log(now() + " [ERR] WASM test error: " + e.message, "#f87171"); }
  } else { log(now() + " [ERR] WebAssembly NOT supported", "#f87171"); }

  // SharedArrayBuffer
  if (typeof SharedArrayBuffer !== "undefined"){
    log(now() + " [OK ] SharedArrayBuffer supported (crossOriginIsolated=" + (window.crossOriginIsolated||false) + ")", "#4ade80");
  } else { log(now() + " [WRN] SharedArrayBuffer NOT supported", "#facc15"); }

  // WebGL
  try {
    var c = document.createElement("canvas");
    var gl = c.getContext("webgl") || c.getContext("experimental-webgl");
    if (gl){ log(now() + " [OK ] WebGL: " + gl.getParameter(gl.VERSION), "#4ade80"); }
    else { log(now() + " [WRN] WebGL not supported", "#facc15"); }
  } catch(e){ log(now() + " [ERR] WebGL error: " + e.message, "#f87171"); }

  // storage
  try {
    var k = "jbtest_" + Date.now();
    localStorage.setItem(k, "ok");
    var v = localStorage.getItem(k);
    localStorage.removeItem(k);
    log(now() + " [INF] localStorage: " + (v === "ok" ? "OK" : "FAIL"), v === "ok" ? "#4ade80" : "#f87171");
  } catch(e){ log(now() + " [ERR] localStorage FAILED: " + e.message, "#f87171"); }

  // gamepad
  try {
    var gps = navigator.getGamepads ? navigator.getGamepads() : [];
    var connected = 0;
    for (var i=0;i<gps.length;i++) if (gps[i]) connected++;
    log(now() + " [INF] Gamepad: " + connected + " connected", connected ? "#4ade80" : "#facc15");
  } catch(e){ log(now() + " [ERR] Gamepad error: " + e.message, "#f87171"); }

  // vibrate
  if (navigator.vibrate){
    var ok = navigator.vibrate(50);
    log(now() + " [INF] Vibration: " + (ok ? "triggered" : "blocked"), ok ? "#4ade80" : "#facc15");
  } else { log(now() + " [WRN] Vibration not supported", "#facc15"); }

  await sleep(300);
  if (state.lastAttemptErrors === 0) { state.successes++; }
  else { log(now() + " [WRN] Attempt had " + state.lastAttemptErrors + " error(s)", "#facc15"); }
  log(now() + " [OK ] === Attempt " + state.attempts + " completed ===", "#4ade80");
  updateRate();
}

async function startJailbreak(){
  if (!isPS5Web()){ log(now() + " [ERR] Not running on PS5 web browser", "#f87171"); return; }
  $('initial-screen').style.display = 'none';
  $('exploit-main-screen').style.display = 'flex';
  state.running = true; state.stopFlag = false;
  $('stopAutoJb').style.display = 'block';
  log(now() + " [WRN] Jailbreak attempt started (single attempt)", "#facc15");
  await runOneAttempt();
  state.running = false;
  $('stopAutoJb').style.display = 'none';
  log(now() + " [WRN] Jailbreak attempt finished", "#facc15");
  // collect logs for sending
  collectLogs();
  renderLogsBox();
}

function stopJailbreak(){
  state.stopFlag = true;
  state.running = false;
  $('stopAutoJb').style.display = 'none';
  log(now() + " [ERR] Stop requested by user", "#f87171");
}

function clearLogs(){
  state.logs = [];
  consoleEl.innerHTML = '<center>--</center>';
  try { localStorage.removeItem('ps5jb_logs'); } catch(e){}
  log(now() + " [WRN] Logs cleared", "#facc15");
}
function collectLogs(){
  try {
    var stored = JSON.parse(localStorage.getItem('ps5jb_logs') || '[]');
    var combined = stored.concat(state.logs);
    var seen = {}; var out = [];
    combined.forEach(function(l){ if (!seen[l]){ seen[l]=1; out.push(l); } });
    state.logs = out;
    log(now() + " [OK ] Collected " + out.length + " log lines", "#4ade80");
    renderLogsBox();
  } catch(e){ log(now() + " [ERR] Collect error: " + e.message, "#f87171"); }
}
function renderLogsBox(){
  var box = $('logsBox');
  if (box) box.value = state.logs.join("\n");
}
function copyLogs(){
  collectLogs();
  renderLogsBox();
  var box = $('logsBox');
  try {
    box.select();
    document.execCommand('copy');
    $('sendStatus').textContent = "Logs copied to clipboard. Paste them to Elena.";
    $('sendStatus').style.color = "#4ade80";
  } catch(e){
    $('sendStatus').textContent = "Copy failed: " + e.message + ". Select manually.";
    $('sendStatus').style.color = "#f87171";
  }
}
function sendLogsToElena(){
  collectLogs();
  renderLogsBox();
  var text = state.logs.join("\n");
  // encode into a downloadable + clipboard; also try to open mailto as a "send" channel
  try { navigator.clipboard.writeText(text); } catch(e){}
  var subject = encodeURIComponent("PS5 jailbreak logs");
  var body = encodeURIComponent(text.slice(0, 1800));
  // open mailto as best-effort "send to you"
  window.location.href = "mailto:?subject=" + subject + "&body=" + body;
  $('sendStatus').textContent = "Prepared logs (" + state.logs.length + " lines). Copied + mailto opened; paste to Elena if needed.";
  $('sendStatus').style.color = "#4ade80";
}

// Init
(function init(){
  if (!isPS5Web()){
    document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#111827;color:#f87171;font-family:system-ui;font-size:20px;text-align:center;padding:24px;">This page only works on the PS5 web browser.<br><span style="color:#9ca3af;font-size:14px;">Open it in the PlayStation 5 browser.</span></div>';
    return;
  }
  try {
    var stored = JSON.parse(localStorage.getItem('ps5jb_logs') || '[]');
    if (stored.length){
      state.logs = stored;
      consoleEl.innerHTML = '';
      stored.forEach(function(l){ var s=document.createElement('span'); s.textContent=l+'\n'; consoleEl.appendChild(s); });
    }
  } catch(e){}
  updateNotifDebug();
  // detect UA for label
  var ua = navigator.userAgent;
  var m = ua.match(/PlayStation 5\/([\d\.]+)/);
  $('PS4FW').textContent = m ? "PS5 firmware: " + m[1] : "PS5 (firmware unknown from UA)";
  log(now() + " [WRN] PS5 WebKitty Jailbreak Test ready", "#facc15");
  log(now() + " [INF] Press the PS button to start", "#9ca3af");
  // show stop button when running handled in start; keep hidden initially
  $('stopAutoJb').style.display = 'none';
})();
</script>
</body>
</html>
