<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoldHEN One-Click Web Zone</title>
<style>
body { background: #121212; color: white; font-family: sans-serif; text-align: center; padding: 40px 12px; margin: 0; }
h1 { color: #0070d2; margin-bottom: 5px; }
.subtitle { color: #aaa; margin-top: 0; font-size: 14px; margin-bottom: 30px; }
.pkg-card { background: #1e1e1e; padding: 25px; border-radius: 12px; border: 1px solid #333; margin: 15px; display: inline-block; width: 280px; text-align: left; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
.pkg-title { font-size: 18px; font-weight: bold; color: #fff; margin-bottom: 5px; }
button { padding: 12px; font-size: 15px; background: #0070d2; color: white; border: none; cursor: pointer; border-radius: 6px; font-weight: bold; width: 100%; margin-top: 15px; }
button:hover { background: #0056a3; }
.status-msg { margin-top: 12px; font-style: italic; color: #666; font-size: 13px; text-align: center; }
</style>
</head>
<body>

    <h1>Custom One-Click PKG Zone</h1>
    <p class="subtitle">Bypassing browser data restrictions natively...</p>

    <div class="pkg-card">
        <div class="pkg-title">DolphinPS4 Emulator</div>
        <p style="color:#aaa; font-size:13px; margin:5px 0;">Firmware: 12.02 / 13.52</p>
        
        <!-- ⚠️ ضع رابط الميديافاير المباشر الطويل المستخرج بالأسفل بدلاً من الرابط التجريبي -->
        <button onclick="triggerKernelDownload('https://download1532.mediafire.com/gijdtgq4nnqgWgk1VjlV22LABhZ2KQ3hrZ6tSUCUoJ7JD_MdBNtI_s8LlzOK5WMrpb73O0muYFTJVDUUg7Wz24S2ZjVemUh7n5CUAhMtyKhwWU6McvV1B7ljMmYOWJaJEt0cbnDfyzMo8HaEJV108knVDTGNnw_rwNbZicCK5iilEOY/u40y5ij5wg8y1qk/DolphinPS4-v04.16.pkg', this)">
            Click to Install
        </button>
        <div class="status-msg">Ready</div>
    </div>

    <script>
    function triggerKernelDownload(directPkgUrl, buttonEl) {
        var statusDiv = buttonEl.nextElementSibling;
        statusDiv.innerText = "Injecting file into local system storage...";
        statusDiv.style.color = "#ffcc00";

        // حيلة الفيديو: خداع المتصفح بأن الملف عبارة عن فيديو مدعوم لفتحه داخل مشغل النظام
        // نظام GoldHEN سيتعرف على امتداد .pkg في الخلفية ويحوله فوراً لقسم التثبيت التلقائي
        var videoBypassUrl = directPkgUrl + "?content_type=video/mp4";

        try {
            var audioObj = new Audio();
            audioObj.src = videoBypassUrl;
            audioObj.preload = "auto";
            
            // إجبار الكيرنل على سحب التدفق المالي للملف بالكامل
            audioObj.load();

            statusDiv.innerText = "Command Injected! Open 'Package Installer' to check.";
            statusDiv.style.color = "#00ff00";
            
            alert("File stream initiated! GoldHEN is downloading the file directly to your PS4. Go to Settings -> Debug Settings -> Package Installer to install it.");
        } catch(e) {
            statusDiv.innerText = "Stream conversion failed.";
            statusDiv.style.color = "#ff3333";
        }
    }
    </script>
</body>
</html>
