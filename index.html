<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 Homebrew Streamer</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        .container {
            background-color: #1e1e1e;
            border: 1px solid #333;
            display: inline-block;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.7);
            max-width: 90%;
        }
        button {
            background-color: #e50914;
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover {
            background-color: #b20710;
        }
        #status {
            margin-top: 20px;
            font-weight: bold;
            color: #46d369;
            font-size: 15px;
        }
        iframe {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>PS4 Direct Stream Installer</h1>
        <p>Bypassing Browser CORS & Daemon Blocks</p>

        <!-- Hidden frame targeting GoldHEN API stream directly -->
        <iframe name="stream_frame" id="stream_frame"></iframe>

        <!-- Standard form posting directly to local GoldHEN installer daemon -->
        <form id="streamForm" action="http://127.0.0.1:9090/api/install" method="POST" target="stream_frame">
            <input type="hidden" name="type" value="direct">
            <input type="hidden" name="packages" id="pkgPayload">
            <button type="submit" onclick="showProgress()">Stream & Install Store-R2.pkg</button>
        </form>

        <div id="status">Ready to transmit payload.</div>
    </div>

    <script>
        // Direct Raw Package URL hosted on your GitHub repository
        var pkgUrl = "https://raw.githubusercontent.com/Raedmhamed/ps4-games-raed/main/Store-R2.pkg";

        // Format as strict JSON string array required by GoldHEN daemon
        document.getElementById('pkgPayload').value = JSON.stringify([pkgUrl]);

        function showProgress() {
            document.getElementById('status').innerText = "Streaming package payload to system daemon...";
            
            // Fallback timeout message in case iframe response is opaque
            setTimeout(function() {
                document.getElementById('status').innerText = "Request transmitted. Check PS4 Notifications > Downloads!";
            }, 3000);
        }
    </script>

</body>
</html>
