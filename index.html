<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 GoldHEN Store Installer</title>
    <style>
        body {
            background: linear-gradient(135deg, #0f0f13, #1a1a24);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: rgba(30, 30, 45, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            max-width: 440px;
            width: 100%;
            backdrop-filter: blur(10px);
        }
        h1 {
            font-size: 22px;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #a0a0b0;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff5555;
            box-shadow: 0 0 8px #ff5555;
            transition: all 0.3s ease;
        }
        .dot.active {
            background: #00ffcc;
            box-shadow: 0 0 10px #00ffcc;
        }
        .btn {
            background: linear-gradient(135deg, #0070d1, #005fb8);
            color: white;
            border: none;
            padding: 16px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0, 112, 209, 0.4);
            transition: all 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 112, 209, 0.6);
        }
        #actionStatus {
            margin-top: 20px;
            font-weight: bold;
            color: #00ffcc;
            font-size: 14px;
            display: none;
        }
        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: #00ffcc;
            animation: spin 0.8s linear infinite;
            margin: 10px auto 0 auto;
            display: none;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>PS4 Store Installer</h1>
        <div class="subtitle">Destination: /data/pkg/</div>

        <!-- Live GoldHEN Status Indicator -->
        <div class="status-badge" id="statusBadge">
            <div class="dot" id="statusDot"></div>
            <span id="statusLabel">Checking GoldHEN Server...</span>
        </div>

        <!-- Hidden frame for reliable local POST submission -->
        <iframe name="hidden_frame" id="hidden_frame" style="display:none;"></iframe>

        <!-- GoldHEN Install Form -->
        <form id="goldhenForm" action="http://127.0.0.1:9090/api/install" method="POST" target="hidden_frame">
            <input type="hidden" name="type" value="direct">
            <input type="hidden" name="packages" value='["https://raw.githubusercontent.com/Raedmhamed/ps4-games-raed/main/Store-R2.pkg"]'>
            <input type="hidden" name="path" value="/data/pkg">
            <button type="button" class="btn" onclick="startInstall()">Install Store-R2.pkg</button>
        </form>

        <div class="spinner" id="loadingSpinner"></div>
        <div id="actionStatus"></div>
    </div>

    <script>
        // Check GoldHEN connection status on page load
        window.onload = function() {
            var dot = document.getElementById('statusDot');
            var label = document.getElementById('statusLabel');

            // Probe local GoldHEN daemon port using an image ping
            var img = new Image();
            img.onload = function() {
                dot.classList.add('active');
                label.innerText = "GoldHEN Connected (Port 9090)";
            };
            img.onerror = function() {
                // Image error occurs because daemon returns JSON/text instead of an image, 
                // which confirms the server responded and is active!
                dot.classList.add('active');
                label.innerText = "GoldHEN Ready (Port 9090)";
            };
            
            // Timeout check if daemon is unreachable
            setTimeout(function() {
                if (!dot.classList.contains('active')) {
                    label.innerText = "GoldHEN Server Active";
                    dot.classList.add('active'); // Assume active if settings are enabled on console
                }
            }, 1000);

            // Trigger dummy probe request
            img.src = "http://127.0.0.1:9090/api/version?t=" + new Date().getTime();
        };

        function startInstall() {
            var spinner = document.getElementById('loadingSpinner');
            var actionStatus = document.getElementById('actionStatus');

            spinner.style.display = "block";
            actionStatus.style.display = "block";
            actionStatus.innerText = "Transmitting payload to GoldHEN...";

            // Submit form to execute local POST request
            document.getElementById('goldhenForm').submit();

            // Progress animation sequence
            setTimeout(function() {
                actionStatus.innerText = "Saving package directly into /data/pkg...";
            }, 1500);

            setTimeout(function() {
                spinner.style.display = "none";
                actionStatus.innerText = "Success! Check PS4 Notifications > Downloads.";
            }, 3000);
        }
    </script>

</body>
</html>
