<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 GoldHEN Package Installer</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        .container {
            background-color: #2a2a2a;
            border: 1px solid #444;
            display: inline-block;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            max-width: 90%;
            width: 400px;
        }
        button {
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
            width: 85%;
        }
        .btn-install { background-color: #0070d1; }
        .btn-install:hover { background-color: #005fb8; }
        #status {
            margin-top: 20px;
            font-weight: bold;
            color: #00ffcc;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>PS4 Homebrew Downloader</h1>
        <p>Target Destination: <code style="color: #00ffcc;">/data/PKG/Store-R2.pkg</code></p>

        <!-- Fixed button utilizing a secure, un-sandboxed JSON stream transmitter -->
        <button class="btn-install" onclick="downloadPkgToInternalStorage()">Download to /data/PKG/</button>

        <div id="status">Status: Ready</div>
    </div>

    <script>
        function downloadPkgToInternalStorage() {
            var statusDiv = document.getElementById('status');
            statusDiv.innerText = "Transmitting format-verified payload...";
            statusDiv.style.color = "#ffcc00";

            // Targeting the console's internal loopback port
            var localApiUrl = "http://127.0.0"; 
            var targetPkgUrl = "https://raw.githubusercontent.com/Raedmhamed/ps4-games-raed/main/Store-R2.pkg";

            // Properly formatted raw JSON object structure required by the PS4 OS backend
            var payload = {
                "url": targetPkgUrl,
                "path": "/data/PKG/Store-R2.pkg"
            };

            // Utilizing JavaScript Fetch to explicitly declare application/json headers
            fetch(localApiUrl, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            })
            .then(response => {
                if (response.ok) {
                    statusDiv.innerText = "Success! Check GoldHEN Task Manager.";
                    statusDiv.style.color = "#00ff00";
                    alert("Download started successfully! The file is being written directly to /data/PKG/.");
                } else {
                    throw new Error("Server rejected formatting template");
                }
            })
            .catch(error => {
                statusDiv.innerText = "Error: Transmission failed.";
                statusDiv.style.color = "#ff3333";
                alert("Error: Ensure GoldHEN is running on your console and the WebBrowser port environment is accessible.");
            });
        }
    </script>

</body>
</html>
