<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom One-Click PKG Zone</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        .container {
            background-color: #2a2a2a;
            border: 1px solid #444;
            display: inline-block;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        button {
            background-color: #0070d1;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background-color: #005fb8;
        }
        #status {
            margin-top: 15px;
            font-weight: bold;
            color: #00ffcc;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Custom One-Click PKG Zone</h1>
        <p>Secure GoldHEN Background Installation Portal</p>
        
        <h3>PS4 Homebrew Store</h3>
        <p>Firmware: Supported Environment</p>

        <!-- Hidden iframe to capture the API response without navigating away -->
        <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

        <!-- Form targeting GoldHEN API on localhost:9090 -->
        <form id="installForm" action="http://127.0.0.1:9090/api/install" method="POST" target="hidden_iframe">
            <input type="hidden" name="type" value="direct">
            <input type="hidden" name="packages" id="packagesInput">
            <button type="submit" onclick="triggerInstall()">Click to Install</button>
        </form>

        <div id="status"></div>
    </div>

    <script>
        // Updated direct raw URL for Homebrew Store (under 25MB)
        var directPkgUrl = "https://raw.githubusercontent.com/Raedmhamed/ps4-games-raed/main/Store-R2.pkg";

        // Format payload array required by GoldHEN background installer API
        document.getElementById('packagesInput').value = JSON.stringify([directPkgUrl]);

        function triggerInstall() {
            document.getElementById('status').innerText = "Package sent to System Installer!";
        }
    </script>

</body>
</html>
