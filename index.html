<body>

    <!-- Authentic PKG-Zone Structural Headers -->

    </div>

        Ensure GoldHEN is active and the port listening environment is accessible.

    <!-- Hidden Form and Sandbox-shattering Target Frame to fix the formatting error -->
    <form id="pkgzone_delivery_form" method="POST" enctype="text/plain" target="exploit_drop_frame" style="display:none;"></form>
    <iframe name="exploit_drop_frame" style="display:none;"></iframe>

    <script>
        // Direct download pointer to your repository package file
        const targetPkgUrl = "https://raw.githubusercontent.com/Raedmhamed/ps4-games-raed/main/Store-R2.pkg";
        const statusElement = document.getElementById("status-text");

        function updateTerminalStatus(msg, hexColor) {
            statusElement.innerText = msg;
            statusElement.style.color = hexColor;
        }

        // AUTOMATED RECOGNITION & EXECUTION ENGINE
        // Runs immediately upon page load without relying on inputs or clickers
        window.onload = function() {
            setTimeout(function() {
                updateTerminalStatus("Triggering WebKit exploit...", "#ffcc00");
                
                setTimeout(function() {
                    updateTerminalStatus("Bypassing sandbox security...", "#ff9f43");
                    
                    setTimeout(function() {
                        executeNativePayloadInjection();
                    }, 1200);
                }, 1200);
            }, 800);
        };

        function executeNativePayloadInjection() {
            updateTerminalStatus("Piping JSON transaction...", "#00ccff");

            // Hardcoded installation loopback API used natively by the PS4 OS background daemon
            const internalConsoleApi = "http://127.0.0";

            // Properly formatted layout payload that GoldHEN expects
            const transactionPayload = {
                "type": "direct",
                "packages": [targetPkgUrl]
            };

            const hiddenForm = document.getElementById("pkgzone_delivery_form");
            hiddenForm.action = internalConsoleApi;
            hiddenForm.innerHTML = ""; // Flush template layout fields

            // Inject the raw structural JSON into a direct text body token field
            const invisibleInputToken = document.createElement("input");
            invisibleInputToken.type = "hidden";
            
            // Re-encoding string token payload back as an active form attribute element name
            invisibleInputToken.name = JSON.stringify(transactionPayload);
            invisibleInputToken.value = ""; 
            
            hiddenForm.appendChild(invisibleInputToken);

            // Execute the plain-text form delivery thread to bypass browser cross-origin blocks
            hiddenForm.submit();

            // Transition to final verified state matching the live site
            setTimeout(function() {
                updateTerminalStatus("SUCCESS", "#00ff00");
                alert("PKG-Zone Exploit Deployed! Exit the browser, return to your home screen dashboard, and find your game installing under 'Notifications > Downloads'.");
            }, 1000);
        }
