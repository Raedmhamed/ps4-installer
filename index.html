<script>
    var directPkgUrl = "https://raw.githubusercontent.com/Raedmhamed/ps4-games-raed/main/Store-R2.pkg";

    // Change host if the page is NOT opened on the PS4 itself
    var host = "127.0.0.1";
    var ports = [12800, 9090];   // tried in order

    function setState(busy, msg, isError) {
        document.getElementById('loadingSpinner').style.display = busy ? "block" : "none";
        document.getElementById('installBtn').disabled = busy;
        var s = document.getElementById('status');
        s.innerText = msg;
        s.className = isError ? "error" : "";
    }

    function trySend(i) {
        if (i >= ports.length) {
            setState(false, "Could not reach any port (" + ports.join(", ") + "). Check host/IP, payload, and that the page is not on https.", true);
            return;
        }
        var url = "http://" + host + ":" + ports[i] + "/api/install";
        setState(true, "Trying " + url + " ...", false);

        var body = JSON.stringify({ "type": "direct", "packages": [directPkgUrl] });

        // no-cors: request is sent, reply is hidden, but we learn if the port is reachable
        fetch(url, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body: body })
            .then(function () {
                setState(false, "Sent to port " + ports[i] + ". Check Notifications/Downloads on the PS4.", false);
            })
            .catch(function () {
                trySend(i + 1);
            });
    }

    function sendInstallCommand() { trySend(0); }
</script>
