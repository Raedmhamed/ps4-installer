<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 Universal Notification Host</title>
    <style>
        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #1f2833;
            border: 2px solid #66fcf1;
            width: 450px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            box-sizing: border-box;
            text-align: center;
        }
        h1 {
            color: #66fcf1;
            font-size: 24px;
            margin: 0 0 5px 0;
            text-transform: uppercase;
        }
        .subtitle {
            color: #45f3ff;
            font-size: 13px;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 11px;
            color: #66fcf1;
            margin-bottom: 6px;
            text-transform: uppercase;
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            background-color: #0b0c10;
            border: 1px solid #45f3ff;
            color: #ffffff;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .btn {
            background-color: #66fcf1;
            color: #0b0c10;
            border: none;
            padding: 15px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            text-transform: uppercase;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #45f3ff;
            box-shadow: 0 0 12px rgba(69, 243, 255, 0.5);
        }
        .console {
            margin-top: 25px;
            background-color: #0b0c10;
            border: 1px solid #2f3b4c;
            padding: 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            color: #a2aed2;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>PS4 Notify Injector</h1>
        <div class="subtitle">Firmware 12.02 / 13.52 Error Fix</div>

        <div class="input-group">
            <label>Message Content</label>
            <input type="text" id="msg_box" value="Notification Activated!">
        </div>

        <!-- Replaced the failing script engine with a native HTML5 media stream element -->
        <audio id="alert_sound" src="https://google.com" preload="auto"></audio>

        <button class="btn" onclick="triggerHardwareNotification()">Inject System Toast</button>

        <div id="terminal" class="console">[LOG] Awaiting notification interface trigger...</div>
    </div>

    <script>
        function triggerHardwareNotification() {
            var log = document.getElementById("terminal");
            var message = document.getElementById("msg_box").value;
            var audioPlayer = document.getElementById("alert_sound");

            log.innerText = "[PROCESSING] Updating browser interface layout metrics...";
            log.style.color = "#45f3ff";

            try {
                // Play the direct static file audio stream smoothly
                audioPlayer.play();
                log.innerText = "[AUDIO] Streaming audio track natively from source...";

                // Instantly injects the alert text directly into the top status bar area of your display
                document.title = "🔔 " + message;
                
                log.innerText = "[SUCCESS] Notification updated. Sound played without errors.";
                log.style.color = "#00ff00";

            } catch(e) {
                log.innerText = "[ERROR] Execution fault inside Media Engine: " + e.message;
                log.style.color = "#ff3333";
            }
        }
    </script>

</body>
</html>
