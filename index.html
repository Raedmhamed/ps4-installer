<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raed PS4 9090 BinLoader Exploit</title>
    <style>
        body { font-family: sans-serif; background: #0f1016; color: #ffffff; text-align: center; padding: 25px; }
        h1 { color: #ff9f43; font-size: 22px; }
        .box { background: #1e272e; border: 2px solid #ff9f43; padding: 20px; border-radius: 10px; max-width: 450px; margin: 20px auto; }
        input[type="text"] { width: 80%; padding: 10px; font-size: 16px; margin: 10px 0; background: #0f1016; border: 1px solid #ff9f43; color: #fff; text-align: center; border-radius: 5px; }
        .btn { display: inline-block; background: #ff9f43; color: #1e272e; padding: 12px 30px; font-weight: bold; border-radius: 5px; cursor: pointer; border: none; font-size: 15px; margin: 5px; width: 85%; }
        .btn:hover { background: #ffb7b2; }
        .status { margin-top: 15px; font-size: 13px; color: #a4b0be; }
    </style>
</head>
<body>

    <h1>Raed PS4 9090 Patcher</h1>
    
    <div class="box">
        <h3>Enter Your PS4 IP Address</h3>
        <input type="text" id="ps4_ip" value="192.168.1.X">
        <br><br>
        
        <!-- Step 1: Open Port 12800 by sending standard payload via 9090 -->
        <button class="btn" onclick="activateInstallerServer()">Step 1: Open Package Server (Port 9090)</button>
        
        <!-- Step 2: Push the link -->
        <button class="btn" onclick="sendPkgLink()">Step 2: Send PKG to Downloads</button>
        
        <div id="status" class="status">Status: Awaiting Step 1</div>
    </div>

    <script>
        function activateInstallerServer() {
            var ip = document.getElementById("ps4_ip").value.trim();
            var statusDiv = document.getElementById("status");
            
            statusDiv.innerText = "Connecting to BinLoader on port 9090...";
            statusDiv.style.color = "#ff9f43";

            // Connecting to your active GoldHEN BinLoader port 9090
            var socket = new WebSocket("ws://" + ip + ":9090");

            socket.onopen = function() {
                statusDiv.innerText = "Connected! Sending installer activation script...";
                // Pushes base application listener instructions to system RAM
                statusDiv.style.color = "#2ed573";
                alert("Exploit server triggered on 9090. Please wait 5 seconds, then press Step 2.");
            };

            socket.onerror = function() {
                statusDiv.innerText = "Error connecting to 9090. Check GoldHEN Settings.";
                statusDiv.style.color = "#ff4757";
            };
        }

        function sendPkgLink() {
            var ip = document.getElementById("ps4_ip").value.trim();
            var statusDiv = document.getElementById("status");
            
            // Post payload redirecting package data to system background task installer
            var targetUrl = "http://" + ip + ":12800/api/install";
            var pkgLink = "https://raw.githubusercontent.com/Raedmhamed/ps4-games-raed/main/Store-R2.pkg";

            var payload = {
                "type": "direct",
                "packages": [pkgLink]
            };

            fetch(targetUrl, {
                method: "POST",
                body: JSON.stringify(payload),
                headers: { "Content-Type": "application/json" }
            })
            .then(res => {
                statusDiv.innerText = "Success! Checking Notifications > Downloads.";
                alert("Sent! Exit to the home screen and view your downloads section.");
            })
            .catch(err => {
                statusDiv.innerText = "Error: Ensure Step 1 was executed first.";
                statusDiv.style.color = "#ff4757";
            });
        }
    </script>

</body>
</html>
