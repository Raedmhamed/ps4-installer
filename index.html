<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 GoldHEN Direct Target</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: sans-serif;
            text-align: center;
            padding-top: 40px;
        }
        .container {
            background-color: #2a2a2a;
            border: 1px solid #444;
            display: inline-block;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            max-width: 90%;
        }
        button {
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
        }
        .btn-notify { background-color: #28a745; }
        .btn-notify:hover { background-color: #218838; }
        .btn-install { background-color: #0070d1; }
        .btn-install:hover { background-color: #005fb8; }
        #status {
            margin-top: 20px;
            font-weight: bold;
            color: #00ffcc;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>PS4 GoldHEN Portal</h1>
        <p>Direct Submission Mode</p>

        <!-- Notification Trigger -->
        <form action="http://127.0.0.1:9090/api/notify" method="POST">
            <input type="hidden" name="message" value="Hello from PS4 Portal!">
            <button class="btn-notify" type="submit" onclick="showStatus('Dispatching Notification...')">Test PS4 Notification</button>
        </form>

        <br>

        <!-- Install Trigger -->
        <form action="http://127.0.0.1:9090/api/install" method="POST">
            <input type="hidden" name="type" value="direct">
            <input type="hidden" name="packages" id="packagesInput">
            <button class="btn-install" type="submit" onclick="showStatus('Dispatching Install Package...')">Install Store-R2.pkg</button>
        </form>

        <div id="status"></div>
    </div>

    <script>
        var directPkgUrl = "https://raw.githubusercontent.com/Raedmhamed/ps4-games-raed/main/Store-R2.pkg";

        // Set the packages payload
        document.getElementById('packagesInput').value = JSON.stringify([directPkgUrl]);

        function showStatus(msg) {
            document.getElementById('status').innerText = msg;
        }
    </script>

</body>
</html>
