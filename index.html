<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 Universal Notification Host</title>
    <style>
        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #1f2833;
            border: 2px solid #66fcf1;
            width: 450px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            box-sizing: border-box;
            text-align: center;
        }
        h1 {
            color: #66fcf1;
            font-size: 24px;
            margin: 0 0 5px 0;
            text-transform: uppercase;
        }
        .subtitle {
            color: #45f3ff;
            font-size: 13px;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 11px;
            color: #66fcf1;
            margin-bottom: 6px;
            text-transform: uppercase;
            font-weight: bold;
        }
        input[type="text"], select {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            background-color: #0b0c10;
            border: 1px solid #45f3ff;
            color: #ffffff;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .btn {
            background-color: #66fcf1;
            color: #0b0c10;
            border: none;
            padding: 15px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            text-transform: uppercase;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #45f3ff;
            box-shadow: 0 0 12px rgba(69, 243, 255, 0.5);
        }
        .console {
            margin-top: 25px;
            background-color: #0b0c10;
            border: 1px solid #2f3b4c;
            padding: 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            color: #a2aed2;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>PS4 Notify Injector</h1>
        <div class="subtitle">Firmware 12.02 / 13.52 Userland Framework</div>

        <div class="input-group">
            <label>Message Content</label>
            <input type="text" id="msg_box" value="Hello from Firmware 13.52!">
        </div>

        <div class="input-group">
            <label>System Icon Overlay</label>
            <select id="icon_select">
                <option value="tex_default_icon_trophy">Trophy Notification</option>
                <option value="tex_icon_ban">System Warning / Ban</option>
                <option value="tex_default_icon_download">System Download Status</option>
                <option value="tex_icon_system">PlayStation Controller Cross</option>
            </select>
        </div>

        <button class="btn" onclick="triggerHardwareNotification()">Inject System Toast</button>

        <div id="terminal" class="console">[LOG] Awaiting memory hook initialization...</div>
    </div>

    <script>
        function triggerHardwareNotification() {
            var log = document.getElementById("terminal");
            var message = document.getElementById("msg_box").value;
            var icon = document.getElementById("icon_select").value;

            log.innerText = "[INJECTING] Attempting Userland WebKit system call interception...";
            log.style.color = "#45f3ff";

            try {
                // STEP 1: Setting up the explicit System Call memory mapping logic for 12.02 / 13.52 firmwares
                // Uses standard WebKit memory allocation pointers to access the shell notification subsystem
                if (window.syscall) {
                    // Allocating memory structure mimicking struct SceNotificationRequest
                    var payloadBuffer = new ArrayBuffer(0xC30); 
                    var view = new DataView(payloadBuffer);
                    
                    // Setting up structural system notification markers variables
                    view.setUint32(0, 0, true);          // Type: Message (0)
                    view.setUint32(4, 0, true);          // ReqId
                    view.setUint32(8, 0, true);          // Priority: Default
                    view.setUint32(40, 0, true);         // Attribute
                    view.setUint8(44, 1);                // HasIcon = true

                    // Injecting string bytes into the message buffer array slots
                    for (let i = 0; i < message.length && i < 1024; i++) {
                        view.setUint8(45 + i, message.charCodeAt(i));
                    }

                    // Injecting system CXML icon structure values into memory segments
                    var fullIconPath = "cxml://psnotification/" + icon;
                    for (let j = 0; j < fullIconPath.length && j < 2048; j++) {
                        view.setUint8(1069 + j, fullIconPath.charCodeAt(j));
                    }

                    // STEP 2: Executing direct kernel system call request
                    // sys_612 mapping address corresponds natively to sceKernelSendNotificationRequest
                    window.syscall(612, 0, payloadBuffer, 0xC30, 0);

                    log.innerText = "[SUCCESS] Memory registers loaded. Toast displayed on UI.";
                    log.style.color = "#00ff00";
                } else {
                    // Fallback simulation mode for testing inside standard computer/phone view environments
                    log.innerText = "[FALLBACK] WebKit engine simulation active. Payload generated.";
                    log.style.color = "#ff9f43";
                    alert("[Notification Simulation]\nIcon: " + icon + "\nText: " + message);
                }
            } catch(e) {
                log.innerText = "[CRITICAL EXCEPTION] WebKit runtime structure mismatch: " + e.message;
                log.style.color = "#ff3333";
            }
        }
    </script>

</body>
</html>
