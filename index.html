<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raed PS4 PKG Installer</title>
    <style>
        body { font-family: sans-serif; background: #111116; color: #ffffff; text-align: center; padding: 30px 15px; }
        h1 { color: #0072ce; font-size: 24px; margin-bottom: 5px; }
        p { color: #aaaaaa; font-size: 14px; margin-bottom: 25px; }
        .card { background: #1c1c24; border: 1px solid #2d2d3d; padding: 25px; margin: 15px auto; border-radius: 8px; max-width: 450px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .app-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; }
        .btn { display: inline-block; background: #003791; color: white; padding: 14px 28px; text-decoration: none; border-radius: 5px; font-weight: bold; cursor: pointer; border: none; width: 100%; box-sizing: border-box; font-size: 15px; transition: background 0.2s; }
        .btn:hover { background: #0056e0; }
        .status-box { margin-top: 15px; font-size: 13px; color: #888; }
    </style>
</head>
<body>

    <h1>Raed PS4 Web Installer</h1>
    <p>Launch GoldHEN on your PS4 before clicking install</p>
        
    <!-- Store-R2 App Card -->
    <div class="card">
        <div class="app-title">Store-R2 PKG</div>
        <p style="margin: 5px 0 20px 0; color: #888;">Source: GitHub Repository</p>
        <button class="btn" onclick="installPKG('https://raw.githubusercontent.com/Raedmhamed/ps4-games-raed/main/Store-R2.pkg')">Direct Install to PS4</button>
        <div id="status" class="status-box">Status: Ready</div>
    </div>

    <script>
        function installPKG(pkgUrl) {
            var localInstallerUrl = "http://127.0.0"; 
            var statusDiv = document.getElementById("status");
            
            statusDiv.innerText = "Sending command to PS4...";
            statusDiv.style.color = "#ffcc00";

            var payload = {
                "type": "direct",
                "url": pkgUrl
            };

            fetch(localInstallerUrl, {
                method: "POST",
                body: JSON.stringify(payload),
                headers: {
                    "Content-Type": "application/json"
                }
            })
            .then(response => {
                statusDiv.innerText = "Success! Check 'Notifications > Downloads'.";
                statusDiv.style.color = "#00ff00";
                alert("Success! Check your PS4 'Notifications > Downloads'.");
            })
            .catch(error => {
                statusDiv.innerText = "Error: Connection failed.";
                statusDiv.style.color = "#ff3333";
                alert("Error: Ensure GoldHEN is active on your PS4 and Remote Package Installer features are enabled.");
            });
        }
    </script>

</body>
</html>
