<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 Direct Local Downloader</title>
    <style>
        body { font-family: sans-serif; background: #0f111a; color: #ffffff; text-align: center; padding: 30px 15px; }
        h1 { color: #0072ce; font-size: 22px; margin-bottom: 5px; }
        p { color: #888899; font-size: 14px; margin-bottom: 25px; }
        .card { background: #1a1d29; border: 1px solid #2d3142; padding: 25px; margin: 15px auto; border-radius: 8px; max-width: 450px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .app-title { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        .path-info { font-size: 12px; color: #00ccff; font-family: monospace; margin-bottom: 20px; }
        .btn { display: inline-block; background: #003791; color: white; padding: 14px 28px; border-radius: 5px; font-weight: bold; cursor: pointer; border: none; width: 100%; box-sizing: border-box; font-size: 15px; text-decoration: none; transition: background 0.2s; }
        .btn:hover { background: #0056e0; }
        .status-box { margin-top: 15px; font-size: 13px; color: #aaabbb; }
    </style>
</head>
<body>

    <h1>PS4 Web-Only File Downloader</h1>
    <p>Downloads directly via browser framework</p>
        
    <!-- File Download Card -->
    <div class="card">
        <div class="app-title">Store-R2.pkg</div>
        <div class="path-info">Source: GitHub Pages Stream</div>
        
        <!-- Standard HTML5 Download Attribute bypassing the broken loopback API -->
        <a id="downloadBtn" class="btn" href="https://raw.githubusercontent.com/Raedmhamed/ps4-games-raed/main/Store-R2.pkg" download="Store-R2.pkg" onclick="updateStatus()">
            Download PKG File
        </a>
        
        <div id="status" class="status-box">Status: Ready</div>
    </div>

    <script>
        function updateStatus() {
            var statusDiv = document.getElementById("status");
            statusDiv.innerText = "Downloading file via browser cache...";
            statusDiv.style.color = "#00ff00";
        }
    </script>

</body>
</html>
