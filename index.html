<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoldHEN Installer Zone</title>
<style>
    body { background: #121212; color: #fff; font-family: sans-serif; text-align: center; padding: 40px 12px; margin: 0; }
    h1 { color: #0070d2; }
    .card { background: #1e1e1e; padding: 25px; border-radius: 12px; border: 1px solid #333; margin: 15px auto; width: 320px; text-align: left; }
    button { padding: 12px; background: #0070d2; color: white; border: none; cursor: pointer; border-radius: 6px; font-weight: bold; width: 100%; margin-top: 15px; }
    button:disabled { background: #333; color: #666; cursor: not-allowed; }
    .status { margin-top: 15px; font-weight: bold; font-size: 13px; text-align: center; color: #ffcc00; }
</style>
</head>
<body>

    <h1>GoldHEN Installer Zone</h1>

    <div class="card">
        <div style="font-weight: bold; font-size: 18px;">📦 Package Installer</div>
        <p style="color: #aaa; font-size: 13px;">Target Directory: /data/pkg</p>
        
        <button id="install-btn" onclick="triggerInstall(this)">Install Package</button>
        <div id="status-text" class="status">Idle</div>
    </div>

<script>
    function triggerInstall(buttonEl) {
        var statusText = document.getElementById('status-text');
        buttonEl.disabled = true;
        statusText.style.color = "#ffcc00";
        statusText.innerText = "Connecting to GoldHEN API...";

        // Target URL for package source
        var targetPkg = "https://download1532.mediafire.com/gijdtgq4nnqgWgk1VjlV22LABhZ2KQ3hrZ6tSUCUoJ7JD_MdBNtI_s8LlzOK5WMrpb73O0muYFTJVDUUg7Wz24S2ZjVemUh7n5CUAhMtyKhwWU6McvV1B7ljMmYOWJaJEt0cbnDfyzMo8HaEJV108knVDTGNnw_rwNbZicCK5iilEOY/u40y5ij5wg8y1qk/DolphinPS4-v04.16.pkg";
        
        // Simple GET request format avoids CORS preflight failures
        var apiUrl = "http://127.0.0.1:9090/api/install?url=" + encodeURIComponent(targetPkg) + "&path=" + encodeURIComponent("/data/pkg");

        var xhr = new XMLHttpRequest();
        xhr.open('GET', apiUrl, true);
        xhr.timeout = 5000;

        xhr.onload = function() {
            if (xhr.status === 200 || xhr.status === 0) {
                statusText.style.color = "#00ff00";
                statusText.innerText = "Task queued! Check PS4 Notifications.";
            } else {
                statusText.style.color = "#ff3333";
                statusText.innerText = "Server Error: Status " + xhr.status;
                buttonEl.disabled = false;
            }
        };

        xhr.onerror = function() {
            statusText.style.color = "#ff3333";
            statusText.innerText = "Connection Failed. Ensure page is loaded via HTTP.";
            buttonEl.disabled = false;
        };

        xhr.ontimeout = function() {
            statusText.style.color = "#ff3333";
            statusText.innerText = "Request Timed Out. Check GoldHEN settings.";
            buttonEl.disabled = false;
        };

        xhr.send();
    }
</script>
</body>
</html>
