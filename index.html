<!DOCTYPE html>
<html>
<head>
    <title>My Personal One-Click PKG Zone</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; text-align: center; padding-top: 50px; }
        .pkg-card { background: #1e1e1e; display: inline-block; padding: 25px; border-radius: 12px; border: 1px solid #333; margin: 15px; width: 320px; }
        button { padding: 12px 24px; font-size: 16px; background: #0070d2; color: white; border: none; cursor: pointer; border-radius: 6px; font-weight: bold; width: 100%; margin-top: 10px; }
        button:hover { background: #0056a3; }
        .status-msg { margin-top: 15px; font-style: italic; color: #aaa; font-size: 14px; }
    </style>
</head>
<body>

    <h1>Welcome to the One-Click PKG Zone</h1>
    <p>Ensure GoldHEN Payload Server is toggled ON before clicking download!</p>
    <br>

    <div id="pkg-list">
        <div class="pkg-card">
            <h3 style="margin-top:0;">Testing</h3>
            <p style="color:#aaa; font-size:14px;">Version: v04.16</p>
            
            <!-- PASTE YOUR EXACT MEDIAFIRE DIRECT LINK INSIDE THE SINGLE QUOTES BELOW -->
            <button onclick="sendToConsole('https://www.mediafire.com/file/u40y5ij5wg8y1qk/DolphinPS4-v04.16.pkg/file', this)">
                Click to Download
            </button>
            <div class="status-msg">Ready</div>
        </div>
    </div>

    <script>
    function sendToConsole(pkgUrl, buttonEl) {
        var statusDiv = buttonEl.nextElementSibling;
        
        if(pkgUrl === "PASTE_YOUR_DIRECT_PKG_LINK_HERE") {
            alert("Error: You haven't pasted your actual file download link into the code yet!");
            return;
        }

        statusDiv.innerText = "Injecting download task into PS4 background queue...";
        statusDiv.style.color = "#ffcc00";

        // Targets localhost (127.0.0.1) over GoldHEN's active Payload Server Port (9090)
        var targetUrl = "http://127.0.0"; 
        
        var payload = {
            "type": "direct",
            "url": pkgUrl
        };

        fetch(targetUrl, {
            method: 'POST',
            body: JSON.stringify(payload),
            headers: { 'Content-Type': 'application/json' }
        })
        .then(response => {
            statusDiv.innerText = "Success! Check your PS4 notifications.";
            statusDiv.style.color = "#00ff00";
        })
        .catch(error => {
            statusDiv.innerText = "Connection Failed.";
            statusDiv.style.color = "#ff3333";
            alert("Could not talk to the console. Check if GoldHEN Payload Server is running on Port 9090!");
        });
    }
    </script>

</body>
</html>
