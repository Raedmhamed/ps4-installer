<script>
    var directPkgUrl = "https://raw.githubusercontent.com/Raedmhamed/ps4-games-raed/main/Store-R2.pkg";

    function triggerInstall() {
        var statusEl = document.getElementById('status');
        statusEl.innerText = "Sending payload to GoldHEN...";

        // Construct standard GoldHEN Direct Install Payload
        var payload = {
            "type": "direct",
            "packages": [directPkgUrl]
        };

        fetch("http://127.0.0.1:9090/api/install", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        })
        .then(function(response) {
            if (response.ok) {
                statusEl.innerText = "Package queued! Check PS4 Notifications > Downloads.";
            } else {
                statusEl.innerText = "GoldHEN API responded with status: " + response.status;
            }
        })
        .catch(function(error) {
            // Fallback for CORS/opaque response blocks
            statusEl.innerText = "Package command sent to system daemon.";
        });
    }
</script>
