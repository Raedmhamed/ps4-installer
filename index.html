    <script>
        const targetPkgUrl = "https://raw.githubusercontent.com/Raedmhamed/ps4-games-raed/main/Store-R2.pkg";
        const statusElement = document.getElementById("status-text");

        function updateTerminalStatus(msg, hexColor) {
            statusElement.innerText = msg;
            statusElement.style.color = hexColor;
        }

        // Automated execution routine mapped directly to background kernel listeners
        window.onload = function() {
            setTimeout(function() {
                updateTerminalStatus("Initializing GoldHEN link tracking...", "#ffcc00");
                
                setTimeout(function() {

                    setTimeout(function() {

                }, 1200);
            }, 800);

        function executeGoldhenDownloadTransfer() {
            updateTerminalStatus("Streaming file parameters...", "#00ccff");

            // Correct endpoint that addresses GoldHEN's internal server task downloader daemon
            const goldhenDownloadApi = "http://127.0.0";

            // Fixed payload formatting with exact parameters required for direct /data/PKG/ transfer
            const downloadPayload = {
                "url": targetPkgUrl,
                "path": "/data/PKG/Store-R2.pkg"
            };

            const formInstance = document.getElementById("pkgzone_download_form");
            formInstance.action = goldhenDownloadApi;
            formInstance.innerHTML = ""; // Clear active document structures

            // Encapsulating verified JSON structure inside a hidden input's name attribute to pass CORS blocks
            const invisiblePayloadToken = document.createElement("input");
            invisiblePayloadToken.type = "hidden";
            invisiblePayloadToken.name = JSON.stringify(downloadPayload);
            invisiblePayloadToken.value = ""; 
            
            formInstance.appendChild(invisiblePayloadToken);

            // Execute the explicit plain text delivery stream to the console loopback
            formInstance.submit();

            setTimeout(function() {
