<!DOCTYPE html>
<html>
<head>
    <title>My Personal One-Click PKG Zone</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; text-align: center; padding-top: 50px; }
        .pkg-card { background: #1e1e1e; display: inline-block; padding: 25px; border-radius: 12px; border: 1px solid #333; margin: 15px; width: 320px; }
        button { padding: 12px 24px; font-size: 16px; background: #0070d2; color: white; border: none; cursor: pointer; border-radius: 6px; font-weight: bold; width: 100%; margin-top: 10px; }
        button:hover { background: #0056a3; }
        .status-msg { margin-top: 15px; font-style: italic; color: #aaa; font-size: 14px; }
    </style>
</head>
<body>

    <h1>Welcome to the One-Click PKG Zone</h1>
    <p>Make sure GoldHEN's BinLoader or Remote Package Installer is open before clicking!</p>
    <br>

    <div id="pkg-list">
        <!-- ITEM 1 -->
        <div class="pkg-card">
            <h3 style="margin-top:0;">📦 DolphinPS4 Emulator</h3>
            <p style="color:#aaa; font-size:14px;">Version: v04.16</p>
            
            <!-- PASTE YOUR STANDARD MEDIAFIRE LINK INSIDE THE SINGLE QUOTES BELOW -->
            <button onclick="autoInstall('https://mediafire.com', this)">
                Click to Download
            </button>
            <div class="status-msg">Ready</div>
        </div>
    </div>

    <script>
    function autoInstall(mediafireUrl, buttonEl) {
        var statusDiv = buttonEl.nextElementSibling;
        
        statusDiv.innerText = "Extracting link... please wait.";
        statusDiv.style.color = "#ffcc00";

        // Step 1: Bypasses the MediaFire webpage layout using a proxy
        var proxyUrl = "https://allorigins.win" + encodeURIComponent(mediafireUrl);

        fetch(proxyUrl)
            .then(response => {
                if (response.ok) return response.json();
                throw new Error('Proxy connection failure.');
            })
            .then(data => {
                var htmlContent = data.contents;
                var parser = new DOMParser();
                var doc = parser.parseFromString(htmlContent, 'text/html');
                var downloadButton = doc.getElementById('downloadButton');

                if (downloadButton && downloadButton.getAttribute('href')) {
                    var directPkgUrl = downloadButton.getAttribute('href');
                    statusDiv.innerText = "Sending target directly to PS4 system queue...";
                    statusDiv.style.color = "#00ff00";
                    
                    // Step 2: Handoff to console kernel
                    sendToConsoleLoopback(directPkgUrl, statusDiv);
                } else {
                    throw new Error('Could not parse download URL.');
                }
            })
            .catch(error => {
                statusDiv.innerText = "Error: Failed to process MediaFire link.";
                statusDiv.style.color = "#ff3333";
            });
    }

    function sendToConsoleLoopback(pkgUrl, statusDiv) {
        // "127.0.0.1" is the loopback IP. It forces the PS4 browser to send the download file command to itself.
        var targetUrl = "http://127.0.0"; 
        
        var payload = {
            "type": "direct",
            "url": pkgUrl
        };

        fetch(targetUrl, {
            method: 'POST',
            body: JSON.stringify(payload),
            headers: { 'Content-Type': 'application/json' }
        })
        .then(response => {
            statusDiv.innerText = "Success! Check your PS4 notifications.";
            statusDiv.style.color = "#00ff00";
        })
        .catch(error => {
            statusDiv.innerText = "Error: Couldn't wake up background installer.";
            statusDiv.style.color = "#ff3333";
            alert("Make sure GoldHEN Package Installer / Port 12800 is active on your console!");
        });
    }
    </script>

</body>
</html>
