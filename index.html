<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoldHEN One-Click Web Zone</title>
<style>
body { background: #121212; color: white; font-family: sans-serif; text-align: center; padding: 40px 12px; margin: 0; }
h1 { color: #0070d2; margin-bottom: 5px; }
.subtitle { color: #aaa; margin-top: 0; font-size: 14px; margin-bottom: 30px; }
.pkg-card { background: #1e1e1e; padding: 25px; border-radius: 12px; border: 1px solid #333; margin: 15px; display: inline-block; width: 280px; text-align: left; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }

button { padding: 12px; font-size: 15px; background: #0070d2; color: white; border: none; cursor: pointer; border-radius: 6px; font-weight: bold; width: 100%; margin-top: 15px; }
button:hover { background: #0056a3; }
button:disabled { background: #444; cursor: not-allowed; }
.status-msg { margin-top: 12px; font-style: italic; color: #ffcc00; font-size: 14px; text-align: center; font-weight: bold; }
/* شريط تقدم مرئي */
.progress-bar-container { width: 100%; background-color: #333; border-radius: 6px; margin-top: 10px; display: none; }
.progress-bar { width: 0%; height: 10px; background-color: #00ff00; border-radius: 6px; transition: width 0.1s; }
</style>
</head>
<body>

            Click to Install
        </button>
        
        <div class="progress-bar-container" id="progress-container">
            <div class="progress-bar" id="my-bar"></div>
        </div>
        <div class="status-msg" id="status-text">Ready</div>
    </div>

    <script>
    function startDownloadWithProgress(directPkgUrl, buttonEl) {
        var statusText = document.getElementById('status-text');
        var progressContainer = document.getElementById('progress-container');
        var progressBar = document.getElementById('my-bar');
        
        // تعديل الرابط لتخطي حظر المتصفح والحفاظ على تدفق البيانات
        var videoBypassUrl = directPkgUrl + "?content_type=video/mp4";

        buttonEl.disabled = true;
        progressContainer.style.display = "block";
        statusText.innerText = "Connecting to file server... 0%";
        statusText.style.color = "#ffcc00";

        // إنشاء طلب تحميل متطور لمراقبة الـ Progress
        var xhr = new XMLHttpRequest();
        xhr.open('GET', videoBypassUrl, true);
        
        // دالة مراقبة تقدم التحميل وحساب النسبة المئوية %
        xhr.onprogress = function(event) {
            if (event.lengthComputable) {
                var percentComplete = Math.round((event.loaded / event.total) * 100);
                
                // تحديث شريط التقدم المرئي والنسبة المئوية نصياً
                progressBar.style.width = percentComplete + '%';
                statusText.innerText = "Downloading: " + percentComplete + "%";
            } else {
                statusText.innerText = "Streaming data bytes...";
            }
        };

        xhr.onload = function() {
            if (xhr.status === 200) {
                progressBar.style.width = '100%';
                statusText.innerText = "Download 100% Complete!";
                statusText.style.color = "#00ff00";
                
                alert("Download Finished! GoldHEN has compiled the file. You can now go to Settings -> Debug Settings -> Package Installer to install it directly onto your home screen.");
            } else {
                statusText.innerText = "Server error. Try again.";
                statusText.style.color = "#ff3333";
                buttonEl.disabled = false;
            }
        };

        xhr.onerror = function() {
            statusText.innerText = "Connection failed.";
            statusDiv.style.color = "#ff3333";
            buttonEl.disabled = false;
        };

        xhr.send();
    }
    </script>

</html>
