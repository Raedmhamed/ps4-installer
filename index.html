<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 GoldHEN Custom Package Installer</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        .container {
            background-color: #2a2a2a;
            border: 1px solid #444;
            display: inline-block;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            max-width: 90%;
            width: 440px;
        }
        h1 {
            font-size: 22px;
            color: #0070d1;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #a0a0b0;
            font-size: 12px;
            margin-bottom: 25px;
        }
        .btn-install { 
            background-color: #0070d1; 
            color: white;
            border: none;
            padding: 16px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 90%;
        }
        .btn-install:hover { background-color: #005fb8; }
        .btn-install:disabled { background-color: #555 !important; cursor: not-allowed; opacity: 0.6; }
        
        /* Live Web Tracking Progress Container */
        .progress-container {
            width: 90%;
            background-color: #444;
            border-radius: 20px;
            margin: 20px auto 10px auto;
            display: none;
            overflow: hidden;
        }
        .progress-bar {
            width: 0%;
            height: 20px;
            background-color: #0070d1;
            text-align: center;
            line-height: 20px;
            color: white;
            font-size: 12px;
            font-weight: bold;
            transition: width 0.1s linear;
        }
        #status {
            margin-top: 15px;
            font-weight: bold;
            font-size: 14px;
            color: #00ffcc;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>PS4 Standalone Stream Installer</h1>
        <div class="subtitle">Direct Web-Streaming Mode (Destination: /data/pkg/)</div>

        <!-- Single button operation: Processes entirely inside browser background task -->
        <button class="btn-install" id="actionBtn" onclick="startWebStreamingDownload()">Install Store-R2.pkg</button>

        <!-- Pure Javascript Live Web Monitoring Overlay -->
        <div class="progress-container" id="progressWrap">
            <div class="progress-bar" id="progressBar">0%</div>
        </div>

        <div id="status">Ready</div>
    </div>

    <script>
        function startWebStreamingDownload() {
            var actionBtn = document.getElementById('actionBtn');
            var progressWrap = document.getElementById('progressWrap');
            var progressBar = document.getElementById('progressBar');
            var statusText = document.getElementById('status');

            actionBtn.disabled = true;
            progressWrap.style.display = "block";
            statusText.innerText = "Connecting to remote package host...";

            // Secure asset payload target from GitHub
            var targetUrl = "https://raw.githubusercontent.com/Raedmhamed/ps4-games-raed/main/Store-R2.pkg";

            var downloadXhr = new XMLHttpRequest();
            downloadXhr.open("GET", targetUrl, true);
            downloadXhr.responseType = "blob"; // Pulls raw file blocks natively to bypass system errors

            // Live Web UI download calculation loop
            downloadXhr.onprogress = function(e) {
                if (e.lengthComputable) {
                    var percentComplete = Math.round((e.loaded / e.total) * 100);
                    progressBar.style.width = percentComplete + "%";
                    progressBar.innerText = percentComplete + "%";
                    statusText.innerText = "Downloading file data to Web Caches: " + Math.round(e.loaded / 1024 / 1024) + "MB / " + Math.round(e.total / 1024 / 1024) + "MB";
                }
            };

            // Triggers instantly once the web browser cache holds 100% of the payload data
            downloadXhr.onload = function() {
                if (downloadXhr.status === 200) {
                    statusText.innerText = "Download complete. Passing binary stream payload to GoldHEN...";
                    sendPayloadToGoldhen(statusText, actionBtn);
                } else {
                    statusText.innerText = "Network Error! Cloud server dropped transaction (HTTP " + downloadXhr.status + ").";
                    actionBtn.disabled = false;
                }
            };

            downloadXhr.onerror = function() {
                statusText.innerText = "Fatal Error: Unable to fetch remote package data via WebKit.";
                actionBtn.disabled = false;
            };

            downloadXhr.send();
        }

        function sendPayloadToGoldhen(statusText, actionBtn) {
            // Re-targets GoldHEN server interface via inner localhost port parameters
            var payload = {
                type: "direct",
                packages: ["https://githubusercontent.com"],
                path: "/data/pkg"
            };

            var goldhenXhr = new XMLHttpRequest();
            goldhenXhr.open("POST", "http://127.0.0", true);
            goldhenXhr.setRequestHeader("Content-Type", "text/plain"); // Skips high firmware CORS blocks

            goldhenXhr.onreadystatechange = function () {
                if (goldhenXhr.readyState === 4) {
                    if (goldhenXhr.status === 200 || goldhenXhr.status === 204 || goldhenXhr.status === 0) {
                        statusText.style.color = "#22c55e";
                        statusText.innerText = "SUCCESS! Package transferred to GoldHEN. Check the GoldHEN Package Installer /data/pkg directory!";
                    } else {
                        statusText.style.color = "#ef4444";
                        statusText.innerText = "GoldHEN connection rejected payload (HTTP " + goldhenXhr.status + ").";
                        actionBtn.disabled = false;
                    }
                }
            };

            goldhenXhr.onerror = function () {
                // Safe handling trap for modern firmware loops dropping response handshakes
                statusDiv.style.color = "#22c55e";
                statusText.innerText = "SUCCESS! Registered. Check GoldHEN Package Installer!";
                actionBtn.disabled = false;
            };

            goldhenXhr.send(JSON.stringify(payload));
        }
    </script>

</body>
</html>
