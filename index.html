<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 GoldHEN Store Installer</title>
    <style>
        body {
            background: #0f0f13;
            color: #ffffff;
            font-family: sans-serif;
            text-align: center;
            padding: 30px;
            margin: 0;
        }
        .container {
            background: #1e1e2d;
            border: 2px solid #0070d1;
            padding: 30px;
            border-radius: 12px;
            max-width: 400px;
            margin: 40px auto;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            color: #0070d1;
        }
        .subtitle {
            color: #a0a0b0;
            font-size: 13px;
            margin-bottom: 25px;
        }
        .btn {
            background: #0070d1;
            color: white;
            border: none;
            padding: 16px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
        }
        .btn:disabled {
            background: #4a4a5a;
            cursor: not-allowed;
        }
        #actionStatus {
            margin-top: 25px;
            font-weight: bold;
            font-size: 15px;
            padding: 12px;
            border-radius: 6px;
            display: none;
        }
        .success-box {
            background: rgba(0, 255, 204, 0.15);
            color: #00ffcc;
            border: 1px solid #00ffcc;
        }
        .error-box {
            background: rgba(255, 85, 85, 0.15);
            color: #ff5555;
            border: 1px solid #ff5555;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>PS4 Store Installer</h1>
        <div class="subtitle">Direct-to-Console Engine via RPI Port 12800</div>

        <!-- Single click trigger for authentic deployment -->
        <button type="button" id="installBtn" class="btn" onclick="triggerInstall()">Install Store-R2.pkg</button>

        <div id="actionStatus"></div>
    </div>

    <script>
        function triggerInstall() {
            var statusDiv = document.getElementById('actionStatus');
            var btn = document.getElementById('installBtn');
            
            btn.disabled = true;
            statusDiv.className = "";
            statusDiv.style.display = "block";
            statusDiv.style.color = "#ffffff";
            statusDiv.innerText = "Connecting to PS4 Remote Package Installer engine...";

            // Authentic API payload mapping for official Remote Package Installer specifications
            var payload = {
                type: "direct",
                packages: ["https://githubusercontent.com"]
            };

            var xhr = new XMLHttpRequest();
            // Switched loopback target endpoint directly to the true package task daemon (Port 12800)
            xhr.open("POST", "http://127.0.0", true);
            xhr.setRequestHeader("Content-Type", "application/json");

            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4) {
                    // Modern PS4 package installation frameworks accept command handshakes with HTTP 200 responses
                    if (xhr.status === 200 || xhr.status === 204) {
                        statusDiv.className = "success-box";
                        statusDiv.innerText = "SUCCESS! Task registered. Exit browser and check Notifications > Downloads.";
                    } else {
                        statusDiv.className = "error-box";
                        statusDiv.innerText = "FAILED! Server returned code: " + xhr.status + ". Re-verify configuration steps.";
                        btn.disabled = false;
                    }
                }
            };

            xhr.onerror = function () {
                statusDiv.className = "error-box";
                statusDiv.innerText = "CONNECTION FAILED! Ensure Remote Package Installer app is OPEN on your PS4 dashboard.";
                btn.disabled = false;
            };

            xhr.send(JSON.stringify(payload));
        }
    </script>

</body>
</html>
