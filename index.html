<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 Custom Notification Spammer</title>
    <style>
        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #1f2833;
            border: 2px solid #66fcf1;
            width: 460px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            box-sizing: border-box;
            text-align: center;
        }
        h1 {
            color: #66fcf1;
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .subtitle {
            color: #45f3ff;
            font-size: 13px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 11px;
            color: #66fcf1;
            margin-bottom: 6px;
            text-transform: uppercase;
            font-weight: bold;
        }
        input[type="text"], select {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            background-color: #0b0c10;
            border: 1px solid #45f3ff;
            color: #ffffff;
            border-radius: 6px;
            box-sizing: border-box;
        }
        select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='10' height='10' fill='%2345f3ff'><polygon points='0,0 10,0 5,5'/></svg>");
            background-repeat: no-repeat;
            background-position: right 15px center;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #66fcf1;
        }
        .btn {
            background-color: #66fcf1;
            color: #0b0c10;
            border: none;
            padding: 14px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #45f3ff;
            box-shadow: 0 0 12px rgba(69, 243, 255, 0.5);
        }
        .console {
            margin-top: 25px;
            background-color: #0b0c10;
            border: 1px solid #2f3b4c;
            padding: 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            color: #a2aed2;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>PS4 Notify Spammer</h1>
        <div class="subtitle">Based on OSM-Made Framework Structure</div>

        <!-- Custom Notification Message Config Card -->
        <div class="form-group">
            <label for="toast_message">Alert Message Text</label>
            <input type="text" id="toast_message" value="Hello World">
        </div>

        <!-- System Asset Icon Selection Dropdown -->
        <div class="form-group">
            <label for="icon_uri">Select System Icon Asset</label>
            <select id="icon_uri">
                <option value="tex_default_icon_notification">Info Chat Bubble</option>
                <option value="tex_default_icon_trophy">Trophy Badge</option>
                <option value="tex_icon_system">PlayStation Action Cross Buttons</option>
                <option value="tex_icon_ban">Circle Slash Block</option>
                <option value="tex_default_icon_download">Download Process Arrow</option>
                <option value="tex_icon_start_rec">Recording Capture Indicator</option>
                <option value="tex_icon_champions_league">Champions League Ball</option>
            </select>
        </div>

        <button class="btn" onclick="sendCustomNotification()">Spam Notification Toast</button>

        <div class="status-title" style="font-size: 11px; text-align: left; color:#66fcf1; margin-top:20px; font-weight:bold; text-transform:uppercase;">Network Log Output</div>
        <div id="terminal" class="console">[LOG] Awaiting network transaction initialization...</div>
    </div>

    <!-- Hidden form wrapper designed to slide payloads straight past standard browser blocks -->
    <form id="delivery_pipe" method="POST" enctype="text/plain" target="hidden_drop_frame" style="display:none;"></form>
    <iframe name="hidden_drop_frame" style="display:none;"></iframe>

    <script>
        function sendCustomNotification() {
            var consoleLog = document.getElementById("terminal");
            var msgText = document.getElementById("toast_message").value;
            var selectedIcon = document.getElementById("icon_uri").value;

            consoleLog.innerText = "[CONNECTING] Dispatching payload transaction to loopback standard port...";
            consoleLog.style.color = "#45f3ff";

            // Correct target routing map to hit GoldHEN's internal server notify API natively
            var goldhenNotifyApi = "http://127.0.0";

            // Properly formatted layout structure matching the custom system notification requirements
            var notifyPayload = {
                "icon": selectedIcon,
                "message": msgText
            };

            var formInstance = document.getElementById("delivery_pipe");
            formInstance.action = goldhenNotifyApi;
            formInstance.innerHTML = ""; // Clear active document structures

            // Encapsulating verified JSON structure inside a hidden input's name attribute to pass CORS blocks
            var payloadTokenNode = document.createElement("input");
            payloadTokenNode.type = "hidden";
            payloadTokenNode.name = JSON.stringify(notifyPayload);
            payloadTokenNode.value = "";

            formInstance.appendChild(payloadTokenNode);

            // Execute the explicit plain text delivery stream to the console loopback
            formInstance.submit();

            consoleLog.innerText = "[SUCCESS] Custom system notification request broadcasted.";
            consoleLog.style.color = "#00ff00";
        }
    </script>

</body>
</html>
